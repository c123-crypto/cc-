<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="application-build" content="2026-08-25-domestic-suite-visible">
<title>AI商品图片工作台</title>
<style>
:root{
  --bg:#f5fbf7;--card:#fffefa;--border:#d8e8df;--text:#294052;--sub:#607989;--light:#91a7b2;
  --primary:#4f91d4;--primary-bg:#e8f4ff;--success:#55a97b;--success-bg:#e9f8ef;
  --warn:#d97706;--warn-bg:#fef3e6;--danger:#dc2626;--danger-bg:#fce8e8;
  --sidebar:#6fa8dc;--accent:#ffe08a;
  --taobao:#ff6a00;--pdd:#e02e24;--a1688:#ff7a00;
  --radius:16px;--shadow:0 8px 28px rgba(29,50,38,.055);--shadow-lg:0 18px 50px rgba(22,44,31,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.app{display:flex;height:100vh;overflow:hidden}

/* === Sidebar === */
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar);color:#f4f0df;border-right:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:100;transition:background .3s ease}
.logo{padding:24px 20px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo svg{flex-shrink:0;color:var(--accent)}.logo small{display:block;font-size:9px;font-weight:400;color:rgba(255,255,255,.65);letter-spacing:.08em}
.catalog-nav{padding:10px}.catalog-btn{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:#d2dfd7;font-size:13px;text-align:left}.catalog-btn:hover,.catalog-btn.active{background:rgba(255,255,255,.12);color:#fff}.nav-section-label{padding:12px 12px 6px;color:rgba(255,255,255,.52);font-size:9px;font-weight:700;letter-spacing:.12em}.category-list{display:flex;flex-direction:column;gap:3px}.category-group{border-radius:9px}.category-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:rgba(255,255,255,.76);font-size:12px;text-align:left;transition:all .15s}.category-btn:hover{background:rgba(255,255,255,.07);color:#fff}.category-btn.active{background:var(--accent);color:var(--sidebar);font-weight:700}.category-icon{width:19px;text-align:center;font-size:14px}.category-count{margin-left:auto;font-size:9px;opacity:.7}.category-chevron{font-size:11px;line-height:1;transition:transform .18s}.category-group.open .category-chevron{transform:rotate(180deg)}.category-tools{max-height:0;overflow:hidden;opacity:0;margin:0 5px;padding-left:26px;border-left:1px solid transparent;transition:max-height .2s ease,opacity .15s ease,margin .2s ease}.category-tools.open{max-height:190px;overflow-y:auto;opacity:1;margin:4px 5px 8px;border-left-color:rgba(255,255,255,.16)}.category-tool{width:100%;display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:6px;color:rgba(255,255,255,.68);font-size:10px;text-align:left}.category-tool:hover,.category-tool.active{background:rgba(255,255,255,.1);color:#fff}.category-tool-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.65;flex-shrink:0}.category-tool span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-section-label{padding:5px 22px 2px;color:rgba(255,255,255,.52);font-size:9px;font-weight:700;letter-spacing:.12em;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.project-list{flex:1;padding:8px 10px 10px;overflow-y:auto}
.project-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:all .15s}
.project-item:hover{background:rgba(255,255,255,.08)}
.project-item.active{background:rgba(255,255,255,.13)}
.project-thumb{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid color-mix(in srgb,var(--accent) 72%,transparent);flex-shrink:0;background:rgba(255,255,255,.1)}
.project-info{flex:1;min-width:0}
.project-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-status{font-size:10px;color:rgba(255,255,255,.62)}.project-delete{opacity:0;color:rgba(255,255,255,.62);padding:5px;font-size:16px;line-height:1}.project-item:hover .project-delete{opacity:1}.project-delete:hover{color:#fff}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}
.status-dot.idle{background:var(--light)}
.status-dot.running{background:var(--primary);box-shadow:0 0 0 2px rgba(255,255,255,.28);animation:pulse 1.5s infinite}
.status-dot.done{background:#ef233c;box-shadow:0 0 0 2px rgba(239,35,60,.18)}
.status-dot.error{background:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.18)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.12)}
.new-project-btn{width:100%;padding:11px;background:var(--accent);color:var(--sidebar);border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.new-project-btn:hover{filter:brightness(1.06)}
.new-project-btn:disabled{opacity:.55;cursor:not-allowed;background:color-mix(in srgb,var(--accent) 60%,#aaa)}
.project-counter{margin-left:auto;font-size:10px;font-weight:600;opacity:.72}
.history-btn{width:100%;padding:9px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.68);display:flex;align-items:center;justify-content:center;gap:6px}
.history-btn:hover{color:#fff}

/* === Main === */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.topbar .api-status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.topbar .settings-btn{width:36px;height:36px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.topbar .settings-btn:hover{color:var(--primary)}
.engine-pill{font-size:10px;color:var(--primary);border:1px solid var(--border);background:color-mix(in srgb,var(--card) 76%,transparent);border-radius:99px;padding:6px 10px}.engine-pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:6px}
.release-pill{font-size:10px;font-weight:700;color:#287956;border:1px solid #bfe5cf;background:#effbf4;border-radius:99px;padding:6px 10px;white-space:nowrap}
.content{padding:30px;max-width:1080px;width:100%;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:4px 0 22px}.hero h2{font-family:Georgia,"Songti SC",serif;font-size:32px;font-weight:500;letter-spacing:-.03em}.hero p{color:var(--sub);font-size:12px;margin-top:7px}.flow-strip{display:flex;gap:6px;flex-wrap:wrap}.flow-strip span{font-size:10px;border:1px solid var(--border);background:rgba(255,255,255,.55);padding:6px 9px;border-radius:99px;color:var(--sub)}

/* === Cards === */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{color:var(--primary)}
.card-title .actions{margin-left:auto;display:flex;gap:8px}

.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.btn:hover{background:var(--primary-bg);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 86%,#2f1e16);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}

/* === Upload === */
.upload-zone{border:1px dashed var(--border);border-radius:var(--radius);padding:46px 20px;text-align:center;cursor:pointer;transition:all .15s;background:color-mix(in srgb,var(--bg) 68%,var(--card))}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-bg)}
.upload-zone.has-image{padding:0;border-style:solid;border-color:var(--border)}
.upload-zone img{max-width:100%;max-height:300px;border-radius:var(--radius);display:block;margin:0 auto}
.upload-icon{color:var(--light);margin-bottom:8px}
.upload-text{font-size:14px;color:var(--sub)}
.upload-hint{font-size:12px;color:var(--light);margin-top:4px}
.project-reference-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-bottom:10px}
.project-reference{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}
.project-reference img{width:100%;aspect-ratio:1;display:block;object-fit:cover}
.project-reference .ref-index{position:absolute;left:7px;top:7px;padding:3px 7px;border-radius:99px;background:rgba(20,31,24,.76);color:#fff;font-size:9px}
.project-reference button{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;background:rgba(20,31,24,.76);color:#fff}
.reference-upload-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reference-upload-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.reference-upload-card .upload-zone{padding:22px 14px;min-height:112px;display:flex;align-items:center;justify-content:center}
.reference-role{font-size:11px;color:var(--sub);line-height:1.55;margin:7px 0 10px}
.material-pipeline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.material-pipeline span{padding:9px;border-radius:10px;background:var(--primary-bg);color:var(--primary);font-size:10px;text-align:center;font-weight:600}

/* === Platform & Suite === */
.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.platform-opt{padding:16px 12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500}
.platform-opt:hover{border-color:var(--primary)}
.platform-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.platform-opt .p-icon{font-size:24px;margin-bottom:6px}
.platform-opt .p-desc{font-size:11px;color:var(--light);margin-top:4px;font-weight:400}

.suite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.suite-opt{padding:12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px}
.suite-opt:hover{border-color:var(--primary)}
.suite-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.suite-opt .s-count{font-size:11px;color:var(--light);margin-top:2px}

.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.direction-opt{padding:13px 14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;font-size:13px;transition:all .15s;text-align:left}
.direction-opt:hover{border-color:var(--primary)}
.direction-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.direction-opt strong{display:block;font-size:13px}.direction-opt span{display:block;margin-top:3px;font-size:10px;line-height:1.5;color:var(--light)}.direction-opt.sel span{color:var(--sub)}

.label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.input,textarea.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px}
textarea.input{resize:vertical;min-height:60px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}

/* === Generation Progress === */
.gen-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gen-item{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 5px 20px rgba(30,48,37,.04)}
.gen-item-img{width:100%;aspect-ratio:1;background:var(--bg);position:relative;display:flex;align-items:center;justify-content:center}
.gen-item-img img{width:100%;height:100%;object-fit:cover}
.gen-item-img.vertical img{object-fit:contain}
.gen-item-placeholder{color:var(--light);font-size:12px;text-align:center;padding:20px}
.gen-item-info{padding:8px 10px}
.gen-item-label{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen-item-meta{font-size:10px;color:var(--light);display:flex;align-items:center;gap:4px;margin-top:2px}
.gen-item-actions{display:flex;gap:4px;margin-top:6px}
.single-redo{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.single-redo label{display:block;font-size:10px;color:var(--sub);margin-bottom:5px}.single-redo textarea{min-height:62px;padding:8px;font-size:10px;line-height:1.5;resize:vertical}.single-redo-note{font-size:9px;color:var(--light);line-height:1.45;margin-top:4px}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-success{background:var(--success-bg);color:var(--success)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-info{background:var(--primary-bg);color:var(--primary)}
.tag-default{background:#f0f1f3;color:var(--sub)}

.progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}.phase-box{background:var(--primary-bg);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:14px}.phase-box strong{display:block;font-size:12px}.phase-box p{font-size:10px;color:var(--sub);margin-top:3px}

/* === Modal === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.image-preview-modal{display:none;position:fixed;inset:0;z-index:420;background:rgba(32,28,30,.82);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:28px}
.image-preview-modal.open{display:flex}.image-preview-dialog{position:relative;max-width:min(92vw,1080px);max-height:92vh}.image-preview-dialog img{display:block;max-width:92vw;max-height:86vh;object-fit:contain;border-radius:16px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.34)}.image-preview-close{position:absolute;right:-12px;top:-12px;width:38px;height:38px;border-radius:50%;background:#fff;color:#332c2f;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.image-preview-title{color:#fff;text-align:center;margin-top:10px;font-size:13px}.previewable{cursor:zoom-in}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadow-lg);margin:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.form-group{margin-bottom:14px}
.connection-results{display:grid;gap:7px;margin-top:10px}.connection-result{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:11px}.connection-result strong{min-width:72px}.connection-result span:last-child{color:var(--sub);word-break:break-word}.connection-result.ok{border-color:var(--success);background:var(--success-bg)}.connection-result.fail{border-color:var(--danger);background:var(--danger-bg)}

/* === Toast === */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;border-left:4px solid var(--primary);animation:slideIn .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* === History === */
.history-item{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.history-item:hover{border-color:var(--primary)}
.history-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0}
.history-info{flex:1}
.history-title{font-size:13px;font-weight:500}
.history-meta{font-size:11px;color:var(--light);margin-top:2px}

.empty{text-align:center;padding:40px 20px;color:var(--light);font-size:13px}
.section-desc{font-size:12px;color:var(--sub);margin-bottom:14px}

/* === Creative tool center === */
.catalog-hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--sidebar) 0%,var(--primary) 62%,var(--accent) 170%);color:#fff;margin-bottom:20px;position:relative;overflow:hidden;transition:background .3s ease}.catalog-hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-130px;background:rgba(255,255,255,.09)}.catalog-hero h2{font-family:Georgia,"Songti SC",serif;font-size:30px;font-weight:500}.catalog-hero p{margin-top:7px;color:rgba(255,255,255,.78);max-width:620px;font-size:13px}.catalog-tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 12px;margin-bottom:8px}.catalog-tab{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.62);font-size:13px;color:var(--sub)}.catalog-tab:hover{border-color:var(--primary);color:var(--primary)}.catalog-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tool-card{min-height:190px;border-radius:18px;border:1px solid var(--border);background:var(--card);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}.tool-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(78,48,32,.12);border-color:var(--primary)}.tool-art{height:108px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#f4e8d7,#e7d1b5)}.tool-art:before,.tool-art:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.55)}.tool-art:before{width:120px;height:120px;right:-20px;top:-45px}.tool-art:after{width:70px;height:70px;left:-16px;bottom:-25px}.tool-art span{font-size:48px;filter:drop-shadow(0 8px 12px rgba(82,50,30,.16));z-index:1}.tool-card:nth-child(4n+2) .tool-art{background:linear-gradient(135deg,#f1e4d5,#dcc2a7)}.tool-card:nth-child(4n+3) .tool-art{background:linear-gradient(135deg,#efe5d8,#dfcdbd)}.tool-card:nth-child(4n+4) .tool-art{background:linear-gradient(135deg,#f6ead6,#e8cfaa)}.tool-copy{padding:14px 16px 16px}.tool-copy h3{font-size:15px}.tool-copy p{font-size:11px;color:var(--sub);line-height:1.55;margin-top:4px}.tool-badge{display:inline-flex;margin-top:9px;padding:2px 7px;border-radius:99px;font-size:9px;background:var(--primary-bg);color:var(--primary)}

function applyDailyTheme(date){
  const now=date||new Date();
  const day=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(now.getFullYear(),0,0))/86400000);
  const theme=DAILY_THEMES[((day%DAILY_THEMES.length)+DAILY_THEMES.length)%DAILY_THEMES.length];
  const root=document.documentElement;
  ['bg','card','border','primary','primaryBg','sidebar','accent'].forEach(key=>root.style.setProperty('--'+key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),theme[key]));
  root.dataset.dailyTheme=theme.name;
  return theme.name;
}

let idb=null;
let downloadFolderName='';
const HISTORY_TTL=24*60*60*1000;
function openIDB(){
  return new Promise((resolve)=>{
    if(idb) return resolve(idb);
    const req=indexedDB.open('ai_img_history',2);
    req.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'}); if(!db.objectStoreNames.contains('preferences')) db.createObjectStore('preferences',{keyPath:'key'}); };
    req.onsuccess=e=>{ idb=e.target.result; resolve(idb); };
    req.onerror=()=>resolve(null);
  });
}
async function idbAdd(rec){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }
async function idbAll(){ const db=await openIDB(); if(!db)return []; return new Promise(r=>{ const tx=db.transaction('records','readonly'); const req=tx.objectStore('records').getAll(); req.onsuccess=()=>r(req.result||[]); req.onerror=()=>r([]); }); }
async function idbDel(id){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }
async function idbPrefGet(key){const db=await openIDB();if(!db||!db.objectStoreNames.contains('preferences'))return null;return new Promise(r=>{const req=db.transaction('preferences','readonly').objectStore('preferences').get(key);req.onsuccess=()=>r(req.result?.value||null);req.onerror=()=>r(null);});}
async function idbPrefPut(key,value){const db=await openIDB();if(!db||!db.objectStoreNames.contains('preferences'))return false;return new Promise(r=>{const tx=db.transaction('preferences','readwrite');tx.objectStore('preferences').put({key,value});tx.oncomplete=()=>r(true);tx.onerror=()=>r(false);tx.onabort=()=>r(false);});}

function fileToBase64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
function base64ToBlob(b64){
  const parts=String(b64||'').split(','); const match=parts[0]?.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64$/);if(!match||!parts[1])throw new Error('图片数据已损坏，请重新生成');const mime=match[1]; const data=atob(parts[1]);
  const arr=new Uint8Array(data.length); for(let i=0;i<data.length;i++)arr[i]=data.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

function projectProductImages(p){
  if(!Array.isArray(p.productImages)) p.productImages=p.image?[p.image]:[];
  p.productImages=p.productImages.filter(Boolean).slice(0,6);
  if(!p.productImages.length&&p.image)p.productImages=[p.image];
  p.image=p.productImages[0]||'';
  return p.productImages;
}
function projectStyleImages(p){
  if(!Array.isArray(p.styleImages)) p.styleImages=p.referenceImage?[p.referenceImage]:[];
  p.styleImages=p.styleImages.filter(Boolean).slice(0,4);
  if(!p.styleImages.length&&p.referenceImage)p.styleImages=[p.referenceImage];
  p.referenceImage=p.styleImages[0]||'';
  return p.styleImages;
}
function projectReferencePreviews(images,kind){
  const label=kind==='product'?'商品证据':'场景参考';
  return images.length?`<div class="project-reference-grid">${images.map((src,index)=>`<div class="project-reference"><img src="${src}" alt="${label} ${index+1}"><span class="ref-index">${label} ${index+1}</span><button type="button" onclick="event.stopPropagation();removeProjectReference('${kind}',${index})" aria-label="移除${label} ${index+1}">×</button></div>`).join('')}</div>`:'';
}
function projectIncludesWhite(p){
  if(typeof p.includeWhite==='boolean') return p.includeWhite;
  return Boolean(p.whiteImage||p.series?.some(item=>item?.label==='白底商品主图'));
}
function normalizeProjectSkuSpecs(value){
  const source=Array.isArray(value)&&value.length?value:DEFAULT_PROJECT_SKUS;
  const normalized=source.slice(0,10).map((item,index)=>({quantity:Math.max(1,Math.min(20,Number(item?.quantity)||index+1)),name:String(item?.name||`${Number(item?.quantity)||index+1}个装`).trim().slice(0,24),recommended:Boolean(item?.recommended)}));
  if(!normalized.some(item=>item.recommended)&&normalized.length) normalized[Math.min(3,normalized.length-1)].recommended=true;
  return normalized;
}
function projectMode(p){ return ['main','detail','sku'].includes(p?.projectMode)?p.projectMode:'main'; }
function projectHasWhiteOutput(p){ return projectMode(p)==='main'&&projectIncludesWhite(p); }
function projectNeedsWhiteMaster(p){ return projectMode(p)==='sku'||projectHasWhiteOutput(p); }
function projectOutputCount(p){ return projectMode(p)==='detail'?4:projectMode(p)==='sku'?normalizeProjectSkuSpecs(p.skuSpecs).length:6; }
function projectNumber(p){ return String(p.projectNumber||Math.max(1,state.projects.indexOf(p)+1)).padStart(2,'0'); }
function projectProductName(analysis){
  const raw=String(analysis?.product_name||analysis?.product_summary||'商品').split(/[\n，。；;：:]/)[0].replace(/^(已综合识别|已识别|这是|商品为|产品为)\s*/,'').replace(/[^\u4e00-\u9fa5A-Za-z0-9·+\-\s]/g,'').trim();
  return (raw||'商品').slice(0,14);
}
function updateProjectNameFromAnalysis(p,analysis){ p.name=`${projectProductName(analysis)} 项目 ${projectNumber(p)}`; }
function projectTextProvider(p){ return p.textProvider||(state.settings.qwenKey?'qwen':state.settings.arkKey?'doubao':state.settings.geminiKey?'gemini':state.settings.openaiKey?'openai':'qwen'); }
function projectImageProvider(p){ return p.imageProvider||(state.settings.arkKey?'seedream':state.settings.qwenKey?'qwen':state.settings.openaiKey?'openai':state.settings.geminiKey?'gemini':'seedream'); }
function hasTextProviderKey(provider){ return provider==='gemini'?Boolean(state.settings.geminiKey):provider==='qwen'?Boolean(state.settings.qwenKey):provider==='openai'?Boolean(state.settings.openaiKey):Boolean(state.settings.arkKey); }
function hasProjectTextKey(p){ return hasTextProviderKey(projectTextProvider(p)); }
function hasAnyImageKey(){ return Boolean(state.settings.geminiKey||state.settings.openaiKey||state.settings.arkKey||state.settings.qwenKey); }
function hasImageProviderKey(provider){ return provider==='gemini'?Boolean(state.settings.geminiKey):provider==='openai'?Boolean(state.settings.openaiKey):provider==='qwen'?Boolean(state.settings.qwenKey):Boolean(state.settings.arkKey); }

function setProjectTextProvider(value){ const p=getCurrentProject();if(!projectEditable(p))return;p.textProvider=value;resetProjectPlan(p);renderMain();renderProjectList(); }
function setProjectImageProvider(value){ const p=getCurrentProject();if(!projectEditable(p))return;p.imageProvider=value;resetProjectPlan(p);renderMain();renderProjectList(); }
function updateProjectWhitePrompt(value){
  const p=getCurrentProject(); if(!p?.analysis) return;
  p.analysis.white_prompt=value;

  scheduleWorkspaceSave();

function updateProjectPrompt(index,value){ const p=getCurrentProject(); if(p?.series[index]) p.series[index].prompt=value; scheduleWorkspaceSave(); }
function updateProjectPromptMeta(index,field,value){ const p=getCurrentProject();if(!p?.series[index]||!['headline','subheadline'].includes(field))return;p.series[index][field]=value;scheduleWorkspaceSave(); }
function projectReferenceRecipeLabel(p,index){ const labels=projectGenerationContext(p,index).labels;return labels.length?`实际发送：${labels.join(' + ')}`:'自动分配'; }
function analysisList(value){ return Array.isArray(value)?value.map(item=>String(item||'').trim()).filter(Boolean):[]; }
function renderProductAnalysis(analysis){
  if(!analysis)return '';
  const identity=analysis.product_identity&&typeof analysis.product_identity==='object'?analysis.product_identity:{};
  const identityItems=[identity.category,identity.shape,...analysisList(identity.materials),...analysisList(identity.colors),...analysisList(identity.dimensions),...analysisList(identity.identity_markers)].filter(Boolean);
  const blocks=[
    ['商品身份',identityItems.length?identityItems:[analysis.product_name||'待确认商品']],
    ['可确认事实',analysisList(analysis.verified_facts)],

    ['使用场景',analysisList(analysis.use_cases)],
    ['目标人群',analysisList(analysis.audience)],
    ['待确认信息',analysisList(analysis.unknowns),'warn'],
  ].filter(item=>item[1].length);
  return `<div class="analysis-grid" id="project-analysis">${blocks.map(([title,items,type])=>`<div class="analysis-block ${type||''}"><strong>${title}</strong><div class="analysis-chips">${items.slice(0,10).map(item=>`<span class="analysis-chip">${esc(item)}</span>`).join('')}</div></div>`).join('')}</div>`;

    <div class="prompt-composer"><div class="project-provider-grid"><div><label for="project-text-provider">提示词与质检模型</label><select class="input" id="project-text-provider" onchange="setProjectTextProvider(this.value)"><option value="qwen" ${textProvider==='qwen'?'selected':''}>千问 Qwen（默认优先）</option><option value="doubao" ${textProvider==='doubao'?'selected':''}>豆包 Seed（第二优先）</option><option value="gemini" ${textProvider==='gemini'?'selected':''}>Gemini（第三优先）</option><option value="openai" ${textProvider==='openai'?'selected':''}>Chat / OpenAI（文字＋视觉）</option></select></div><div><label for="project-image-provider">图片生成模型</label><select class="input" id="project-image-provider" onchange="setProjectImageProvider(this.value)"><option value="seedream" ${imageProvider==='seedream'?'selected':''}>即梦 / Seedream 5.0</option><option value="gemini" ${imageProvider==='gemini'?'selected':''}>Nano Banana 2</option><option value="qwen" ${imageProvider==='qwen'?'selected':''}>Qwen Image 3.0</option><option value="openai" ${imageProvider==='openai'?'selected':''}>GPT Image 2</option></select></div></div><label class="label" for="user-note">告诉 AI 你想要什么</label><textarea class="input" id="user-note" maxlength="2000" placeholder="例如：卡皮巴拉暖棕色居家场景，突出柔软材质，保留右侧文案留白，不要价格、促销字样和多余道具。" oninput="updateNote()">${esc(p.userNote||'')}</textarea><div class="prompt-composer-footer"><span class="prompt-composer-hint">可写场景、色调、目标人群、核心卖点和不要出现的元素</span><button class="btn btn-primary" ${canPlan?'':'disabled'} onclick="planProjectPrompts()">① ${planLabel}</button></div></div>

function renderSkuSpecEditor(p){
  const specs=normalizeProjectSkuSpecs(p.skuSpecs);
  return `<div class="sku-spec-list">${specs.map((spec,index)=>`<div class="sku-spec-row"><input class="input" type="number" min="1" max="20" value="${spec.quantity}" aria-label="SKU数量" onchange="updateSkuSpec(${index},'quantity',this.value)"><input class="input" maxlength="24" value="${esc(spec.name)}" aria-label="SKU名称" placeholder="例如 家庭实惠装" onchange="updateSkuSpec(${index},'name',this.value)"><label class="sku-recommend"><input type="radio" name="sku-recommended" ${spec.recommended?'checked':''} onchange="setSkuRecommended(${index})"> 推荐款</label><button class="sku-remove" onclick="removeSkuSpec(${index})" aria-label="删除SKU">×</button></div>`).join('')}</div><div style="margin-top:9px"><button class="btn btn-sm" ${specs.length>=10?'disabled':''} onclick="addSkuSpec()">＋ 添加规格</button></div>`;
}
function renderProjectModeSettings(p){
  const mode=projectMode(p);
  return `<div class="card" id="project-settings" style="scroll-margin-top:80px"><div class="card-title"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>生成用途</div><div class="mode-grid">
    <div class="mode-opt ${mode==='main'?'sel':''}" onclick="setProjectMode('main')"><strong>商品主图 / 套图</strong><span>固定6张主图，支持1:1或3:4；其中3张共享同一简洁背景。</span></div>
    <div class="mode-opt ${mode==='detail'?'sel':''}" onclick="setProjectMode('detail')"><strong>详情页套图</strong><span>固定4张，覆盖价值、结构、证据和真实场景收尾。</span></div>
    <div class="mode-opt ${mode==='sku'?'sel':''}" onclick="setProjectMode('sku')"><strong>SKU规格图</strong><span>先做统一商品母版，再精确排出每个规格的真实数量。</span></div>
  </div>
  ${mode==='main'?`<div class="logic-note" style="margin-top:18px"><strong>固定6张：</strong>爆款首图 → 同背景陈列变化 → 同背景使用变化 → 同背景收纳变化 → 功能材质证据 → 转化收尾。第2–4张使用同一背景母版与光线，只改变摆位、收纳物和机位；背景道具不超过3件。</div>`:''}
  ${mode==='detail'?`<div class="logic-note" style="margin-top:18px"><strong>固定4张：</strong>首屏价值 → 功能结构 → 材质尺寸证据 → 真实场景收尾。四张共同构成精简详情页叙事。</div>`:''}
  ${mode==='sku'?`<div class="card-title" style="margin-top:18px">SKU规格与数量</div>${renderSkuSpecEditor(p)}<div class="field-row" style="margin-top:14px"><div class="form-group"><label class="label">背景要求</label><select class="input" onchange="setSkuBackground(this.value)"><option value="auto" ${p.skuBackground==='auto'?'selected':''}>自动识别补充要求</option><option value="white" ${p.skuBackground==='white'?'selected':''}>白色背景</option><option value="black" ${p.skuBackground==='black'?'selected':''}>黑色背景</option><option value="warm" ${p.skuBackground==='warm'?'selected':''}>暖米色背景</option><option value="gray" ${p.skuBackground==='gray'?'selected':''}>浅灰背景</option></select></div><div class="form-group"><label class="label">商品长宽高</label><input class="input" maxlength="80" value="${esc(p.skuDimensions||'')}" placeholder="例如：长11.8cm × 宽7.8cm × 高6.6cm" onchange="setSkuDimensions(this.value)"></div></div><div class="form-group"><label class="label">买家主卖点</label><input class="input" maxlength="42" value="${esc(p.skuSellingPoint||'')}" placeholder="例如：透明收纳，一眼找到常用小物" onchange="setSkuSellingPoint(this.value)"><div class="model-note">只写给买家看的购买理由；不会再展示“SKU编号、请核对资料、精确排版”等内部话术。</div></div><div class="logic-note">统一逻辑：所有 SKU 共用同一商品母版、背景、配色和版式；网页按真实数量确定性排版，避免模型猜错数量。尺寸与卖点会进入首次生成和单张重做。</div>`:''}
  </div>`;
}

function imageProviderLabel(provider){ return provider==='gemini'?'Nano Banana 2':provider==='openai'?'GPT Image 2':provider==='qwen'?'Qwen Image 3.0':provider==='seedream'?'Seedream 5.0':''; }
function imageModelLabel(model){ const value=String(model||'').toLowerCase();return value.includes('gemini')?'Nano Banana':value.includes('openai')||value.includes('gpt-image')?'GPT Image':value.includes('seedream')||value.includes('doubao')?'Seedream':model||'图片模型'; }
function renderSeries(p){
  const items=projectOutputLabels(p);
  return `<div class="gen-list">
    ${p.series.map((s,i)=>{
      const qc=p.qcResults[i];
      const isVert=projectMode(p)==='detail'||p.suiteType==='vertical'||(p.suiteType==='full'&&i>=5);
      return `<div class="gen-item">
        <div class="gen-item-img ${isVert?'vertical':''}">
          ${s.image?`<img class="previewable" src="${s.image}" onclick="openImagePreview(this.src,'${esc(s.label||items[i])}')" alt="${esc(s.label||items[i])}">`:`<div class="gen-item-placeholder">${s.status==='running'?'生成中...':s.status==='error'?'❌ 失败':'⏳ 待生成'}</div>`}
        </div>
        <div class="gen-item-info">
          <div class="gen-item-label">${i+1}. ${esc(s.label||items[i])}</div>
          <div class="gen-item-meta">
            ${s.model?`<span class="tag tag-info">${esc(imageModelLabel(s.model))}</span>`:''}
            ${s.fallback?`<span class="tag tag-warn">自动备用：${esc(imageProviderLabel(s.provider))}</span>`:''}
            ${qc?qc.pass?`<span class="tag tag-success">${qc.redone?'↻ 重做通过':'✓ 主体保真通过'} ${qc.score}分</span>`:qc.review_required?`<span class="tag tag-warn">⚠ 已保留 · 待人工复核 ${qc.score}分</span>`:`<span class="tag tag-danger">✕ 主体保真未通过 ${qc.score}分</span>`:''}
          </div>
          ${s.referenceRecipe?.length?`<div style="font-size:10px;color:var(--light);margin-top:5px;line-height:1.45">参考配方：${esc(s.referenceRecipe.join(' + '))}</div>`:''}
          ${qc?.summary?`<div style="font-size:10px;color:var(--light);margin-top:5px;line-height:1.45">${esc(qc.summary)}</div>`:''}
          <div class="single-redo">
            <label>这张图的重做补充提示词（可选）</label>
            <textarea class="input" maxlength="1200" placeholder="例如：保留原商品，只把场景改成明亮梳妆台；镜头稍微拉近；减少道具。" oninput="setSingleRedoPrompt(${i},this.value)">${esc(s.redoPrompt||'')}</textarea>
            <div class="single-redo-note">只影响当前第 ${i+1} 张；其他成品和原图都会保留。也可写“去掉文字”或“保留文字、去掉文字背景”。</div>
            ${s.appliedRedoPrompt?`<div class="single-redo-note" style="color:var(--success)">本版实际采用：${esc(s.appliedRedoPrompt)}</div>`:''}
          </div>
          <div class="gen-item-actions">
            ${s.image?`<button class="btn btn-sm" onclick="openImagePreview(this.closest('.gen-item').querySelector('.gen-item-img img').src,'${esc(s.label||items[i])}')">预览大图</button>`:''}
            ${s.image?`<button class="btn btn-sm" onclick="downloadSingle(${i})">下载</button>`:''}
            ${s.status!=='running'&&s.prompt?`<button class="btn btn-sm" onclick="regenSingle(${i})">${s.image?'仅重做此图':'仅生成此图'}</button>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

/* ============ API CALLS ============ */
async function apiCall(path,data,extraHeaders){
  const headers={'Content-Type':'application/json','X-Request-Id':uid(),...(extraHeaders||{})};
  if(state.settings.arkKey) headers['X-Ark-Key']=state.settings.arkKey;
  if(state.settings.openaiKey) headers['X-OpenAI-Key']=state.settings.openaiKey;
  if(state.settings.geminiKey) headers['X-Gemini-Key']=state.settings.geminiKey;
  if(state.settings.qwenKey) headers['X-Qwen-Key']=state.settings.qwenKey;
  if(state.settings.qwenEndpoint) headers['X-Qwen-Endpoint']=state.settings.qwenEndpoint;
  const resp=await fetch(getApiBase()+path,{method:'POST',headers,body:JSON.stringify(data)});
  const raw=await resp.text();
  let json={};
  try{ json=raw?JSON.parse(raw):{}; }catch(e){ throw new Error('服务器返回格式异常（HTTP '+resp.status+'）'); }
  if(!resp.ok){
    const detail=[json.error||'请求失败（HTTP '+resp.status+'）',json.code&&`错误码 ${json.code}`,json.requestId&&`追踪号 ${json.requestId}`].filter(Boolean).join(' · ');
    const error=new Error(detail); error.code=json.code||''; error.requestId=json.requestId||''; error.status=resp.status; error.providerFailures=Array.isArray(json.providerFailures)?json.providerFailures:[]; throw error;
  }
  return json;
}

function browserModelText(message){
  if(typeof message?.content==='string') return message.content;
  if(Array.isArray(message?.content)) return message.content.map(item=>typeof item==='string'?item:item?.text||'').join('\n');
  return typeof message?.reasoning_content==='string'?message.reasoning_content:'';
}
function browserJsonObject(text){
  const clean=String(text||'').replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();
  const start=clean.indexOf('{'),end=clean.lastIndexOf('}');
  if(start<0||end<=start) throw new Error('视觉模型未返回有效的 JSON');
  try{return JSON.parse(clean.slice(start,end+1));}catch(error){throw new Error('视觉模型返回的 JSON 格式无法解析');}
}
function isArkTlsFailure(error){

}
function isQwenTlsFailure(error){

function qwenBrowserOrigin(){

  let url;try{url=new URL(raw);}catch(error){throw new Error('千问请求地址格式不正确');}
  const host=url.hostname.toLowerCase();
  const legacy=['dashscope.aliyuncs.com','dashscope-intl.aliyuncs.com','dashscope-us.aliyuncs.com'].includes(host);
  const workspace=/^[a-z0-9-]+\.(?:cn-beijing|ap-southeast-1)\.maas\.aliyuncs\.com$/.test(host);
  if(url.protocol!=='https:'||url.username||url.password||url.port||(!legacy&&!workspace))throw new Error('千问请求地址必须是阿里云百炼官方 HTTPS 域名');
  return url.origin;
}
async function directQwenText(prompt,images=[],options={}){

  const content=images.length?[...images.slice(0,10).map(image=>({type:'image_url',image_url:{url:image}})),{type:'text',text:prompt}]:prompt;
  const body={model,messages:[{role:'user',content}],temperature:options.temperature??.3,max_tokens:options.maxTokens||5200,stream:false};

  try{resp=await fetch(qwenBrowserOrigin()+'/compatible-mode/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.settings.qwenKey},body:JSON.stringify(body)});}

}
async function directArkText(prompt,images=[],options={}){

  const content=images.length?[{type:'text',text:prompt},...images.slice(0,10).map(image=>({type:'image_url',image_url:{url:image}}))]:prompt;
  const body={model,messages:[{role:'user',content}],temperature:options.temperature??.3,max_tokens:options.maxTokens||5200,stream:false};
  if(options.json) body.response_format={type:'json_object'};

    const responses=await fetch('https://ark.cn-beijing.volces.com/api/v3/responses',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.settings.arkKey},body:JSON.stringify({model,input:prompt,max_output_tokens:options.maxTokens||2600,stream:false})});

    if(responses.ok&&output)return output;
    throw new Error(payload?.error?.message||payload?.message||`火山 Responses 浏览器直连失败（HTTP ${responses.status}）`);
  }

}

  p.series=labels.map((label,index)=>({id:index,label,prompt:'',image:'',status:'pending',model:'',provider:'',fallback:false,fallbackFrom:'',redoPrompt:'',...(p.series[index]||{}),id:index,label}));
  if((projectNeedsWhiteMaster(p)&&!p.analysis.white_prompt?.trim())||p.series.some(item=>!item.prompt?.trim())){ toast('请补全所有图片提示词','warn'); return; }
  p.series.forEach(item=>{ item.image='';item.status='pending';item.model='';item.provider='';item.fallback=false;item.fallbackFrom=''; });
  p.qcResults=[]; p.status='running'; p.phase=hasWhiteOutput?'正在根据已确认提示词制作白底主图':'正在生成全部场景套图'; p.whiteImage='';
  renderMain(); renderProjectList();
  try{
    if(projectMode(p)==='sku'){
      await generateSkuProject(p);
    }else{
    if(hasWhiteOutput){
      const whiteRefs=projectProductImages(p).slice(0,6);
      const mainAspect=outputAspect(p);
      const whitePrompt=`${p.analysis.white_prompt}\n${PRODUCT_GEOMETRY_LOCK}\n${PRODUCT_REALISM_LOCK}`.trim();
      const whiteResp=await projectImageCall(p,'/api/white-image',{prompt:whitePrompt,userNote:p.userNote,imageBase64:p.image,imageBase64s:whiteRefs,aspect:mainAspect,...modelOptions(p)},whiteRefs,mainAspect);
      p.whiteImage=whiteResp.image;
      if(whiteResp.fallback) toast(`白底主图已从${whiteResp.fallbackFrom||imageProviderLabel(projectImageProvider(p))}自动切换到${imageProviderLabel(whiteResp.provider)}`,'warn');
      p.series[0]={...p.series[0],prompt:p.analysis.white_prompt,image:await composeMainCanvas(whiteResp.image,p.series[0],0,p,true),status:'done',model:(whiteResp.model||projectImageProvider(p))+' + 主图规格校正',provider:whiteResp.provider||projectImageProvider(p),fallback:Boolean(whiteResp.fallback),fallbackFrom:whiteResp.fallbackFrom||''};
      p.qcResults[0]={pass:true,score:100,summary:'白底商品主图',correction:''};
    }
    renderMain(); renderProjectList();
    const offset=hasWhiteOutput?1:0;
    const jobs=p.series.slice(offset).map((item,i)=>()=>generateOneTask(p,{label:labels[i+offset],prompt:item.prompt},i+offset));
    await runPool(jobs,2);
    }

    const doneCount=p.series.filter(item=>item.image).length;
    const reviewCount=p.qcResults.filter(result=>result?.review_required).length;
    p.status=doneCount===labels.length?'done':'error';
    p.phase=doneCount===labels.length?(reviewCount?`整套图片已生成，${reviewCount} 张待人工复核`:'整套图片已生成并完成质检'):'部分图片未完成，可单张重做';
    renderMain(); renderProjectList();
    if(doneCount){
      await idbAdd({id:p.id,name:p.name,projectNumber:p.projectNumber,platform:p.platform,projectMode:projectMode(p),mainAspect:p.mainAspect||'square',suiteType:p.suiteType,detailCount:p.detailCount,skuSpecs:normalizeProjectSkuSpecs(p.skuSpecs),includeWhite:hasWhiteOutput,direction:p.direction,whiteImage:p.whiteImage,series:p.series.map(item=>({label:item.label,image:item.image,model:item.model,provider:item.provider,fallback:item.fallback,fallbackFrom:item.fallbackFrom,prompt:item.prompt,referenceRecipe:item.referenceRecipe||[]})),qcResults:p.qcResults,createdAt:Date.now()});
      toast((doneCount===labels.length?(reviewCount?`整套已生成，${reviewCount}张待人工复核。`:'整套生成完成！'):'生成完成，部分图片需要重做。')+' 已保存到历史记录',doneCount===labels.length&&!reviewCount?'success':'warn');
    }
  }catch(error){
    p.status='error'; p.phase='任务中断'; renderMain(); renderProjectList();
    toast('生成失败：'+error.message,'error');
  }
}

async function regenSingle(idx){
  const p=getCurrentProject(); if(!p) return;
  const item=p.series[idx]; if(!item||!item.prompt) return;
  if(projectNeedsWhiteMaster(p)&&!p.whiteImage&&!(projectHasWhiteOutput(p)&&idx===0)){toast('请先生成白底商品母版，再单独生成当前图片','warn');return;}
  const original={...item},originalQc=p.qcResults[idx]||null,originalWhite=p.whiteImage;
  const basePrompt=String(item.prompt||'').trim(),extra=String(item.redoPrompt||'').trim();
  const finalRequirement=redoPriorityRule(extra);
  const singlePrompt=`${userHardConstraints(p.userNote)}\n${p.seriesStyle||seriesStyleContract(p.userNote)}\n${TEXT_FREE_BASE_RULE}\n以下原方案仅作次级上下文：${basePrompt}\n只允许修改当前画面，不得影响本套其他图片；严格保持原商品主体。\n${finalRequirement}`;
  if(projectHasWhiteOutput(p)&&idx===0){
    item.status='running';p.phase='正在只重做第 1 张白底商品主图';renderMain();renderProjectList();
    try{
      const refs=projectProductImages(p).slice(0,6),aspect=outputAspect(p);
      const response=await projectImageCall(p,'/api/white-image',{prompt:`${singlePrompt}\n${PRODUCT_GEOMETRY_LOCK}\n${PRODUCT_REALISM_LOCK}\n${finalRequirement}`,userNote:p.userNote,imageBase64:p.image,imageBase64s:refs,aspect,...modelOptions(p)},refs,aspect);
      const qc=await projectQcCall(p,{productImagesBase64s:refs,whiteImageBase64:originalWhite||undefined,generatedImageBase64:response.image,taskLabel:item.label,platform:p.platform,imageProvider:projectImageProvider(p),textProvider:projectTextProvider(p),openaiTextModel:state.settings.openaiTextModel||undefined,visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined,qwenVisionModel:state.settings.qwenVisionModel||undefined,qwenEndpoint:state.settings.qwenEndpoint||undefined});
      if(!qc.pass)throw new Error(`新图主体保真质检未通过（${qc.score||0}分）`);
      p.whiteImage=response.image;p.series[idx]={...item,prompt:basePrompt,redoPrompt:extra,appliedRedoPrompt:extra,image:await composeMainCanvas(response.image,item,idx,p,true),status:'done',model:(response.model||projectImageProvider(p))+' + 单张重做',provider:response.provider||projectImageProvider(p),fallback:false,fallbackFrom:''};p.qcResults[idx]={...qc,redone:true};
      toast('第1张已单独重做完成，其他图片未消耗','success');
    }catch(error){p.whiteImage=originalWhite;p.series[idx]={...original,status:original.image?'done':'error'};p.qcResults[idx]=originalQc;toast((original.image?'新图未通过，已保留原图：':'单张重做失败：')+error.message,'error');}
    p.status=p.series.filter(entry=>entry.image).length===projectOutputCount(p)?'done':'error';p.phase=p.status==='done'?'六张主图完整':'部分图片未完成，可只补做缺少的图片';renderMain();renderProjectList();return;
  }
  if(projectMode(p)==='sku'){
    item.status='running';renderMain();
    try{const spec=normalizeProjectSkuSpecs(p.skuSpecs)[idx];item.image=await composeSkuCanvas(p.whiteImage,spec,p.analysis,idx,p,extra);item.status='done';item.model='SKU确定性排版';item.redoPrompt=extra;item.appliedRedoPrompt=extra;p.qcResults[idx]={pass:true,score:100,summary:`已按本次补充要求重新排版 ${spec.quantity} 个商品`,correction:''};toast('当前规格图重新排版完成','success');}catch(error){p.series[idx]={...original,status:original.image?'done':'error'};p.qcResults[idx]=originalQc;toast((original.image?'重排失败，已保留原图：':'规格图重做失败：')+error.message,'error');}renderMain();renderProjectList();return;
  }
  item.status='running';item.image='';p.qcResults[idx]=null;p.phase='正在只重做第 '+(idx+1)+' 张';renderMain();renderProjectList();
  await generateOneTask(p,{label:item.label,prompt:singlePrompt,finalRequirement},idx);
  if(item.image){item.prompt=basePrompt;item.redoPrompt=extra;item.appliedRedoPrompt=extra;p.status=p.series.filter(entry=>entry.image).length===projectOutputCount(p)?'done':'error';p.phase=p.status==='done'?'整套图片已生成并完成质检':'部分图片未完成，可只补做缺少的图片';toast('第'+(idx+1)+'张已单独重做，其他图片未消耗','success');}
  else{p.series[idx]={...original,status:original.image?'done':'error'};p.qcResults[idx]=originalQc;p.status=p.series.filter(entry=>entry.image).length===projectOutputCount(p)?'done':'error';p.phase=original.image?'新图未通过，已保留原图':'当前图片仍未完成，可修改提示词后再单独生成';toast(original.image?'新图未通过严格质检，已自动保留原图':'第'+(idx+1)+'张单独生成失败','error');}
  renderMain();renderProjectList();
}

/* ============ DOWNLOAD ============ */
async function downloadSingle(idx){
  const p=getCurrentProject(); if(!p) return;
  const s=p.series[idx]; if(!s||!s.image) return;
  const folder=downloadProjectFolder(p.name,projectNumber(p));
  try{await saveDownloadedFile(await imageSourceBlob(s.image),`${p.name}_${idx+1}_${s.label}.png`,folder);}catch(error){toast('下载失败：'+error.message,'error');}
}
async function downloadAll(){
  const p=getCurrentProject(); if(!p) return;
  const imgs=p.series.filter(s=>s.image);
  const expected=projectOutputCount(p);
  if(imgs.length<expected){ toast('需要'+expected+'张图才能下载整套，当前'+imgs.length+'张','warn'); return; }
  toast('正在打包ZIP...','');
  try{
    if(typeof JSZip==='undefined'){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    const zip=new JSZip();
    for(let i=0;i<imgs.length;i++) zip.file(`${p.name}_${String(i+1).padStart(2,'0')}_${imgs[i].label}.png`,await imageSourceBlob(imgs[i].image));
    const content=await zip.generateAsync({type:'blob'});
    const saved=await saveDownloadedFile(content,`${p.name}_套图.zip`,downloadProjectFolder(p.name,projectNumber(p)));
    toast(saved.folder?`ZIP 已保存到 ${saved.folder}`:'ZIP下载完成','success');
  }catch(err){ toast('ZIP打包失败：'+err.message,'error'); }
}
function loadScript(src){ return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); }); }

function connectionResultsHtml(){
  const configured=[state.settings.geminiKey&&['gemini','Gemini'],state.settings.arkKey&&['doubao','火山方舟'],state.settings.qwenKey&&['qwen','千问'],state.settings.openaiKey&&['openai','OpenAI']].filter(Boolean);
  if(!configured.length) return '<div class="connection-result"><strong>尚未填写</strong><span>请至少配置一个模型服务</span></div>';
  return configured.map(([id,label])=>{const item=providerHealth[id];const cls=item?(item.ok?'ok':'fail'):'';const icon=item?(item.ok?'✅':'❌'):'⚪';return `<div class="connection-result ${cls}"><strong>${icon} ${label}</strong><span>${esc(item?.message||'已填写，等待检测')}</span></div>`;}).join('');

async function directArkConnectionTest(){
  const model=cleanModelId(state.settings.arkTextModel||state.settings.visionModel);
  if(!model) throw new Error('请先填写火山文字模型 ID');
  const resp=await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.settings.arkKey},
    body:JSON.stringify({model,messages:[{role:'user',content:'只回复两个字：通过'}],max_tokens:256,stream:false})
  });
  const raw=await resp.text(); let data={};
  try{data=raw?JSON.parse(raw):{};}catch(e){}
  if(!resp.ok){
    const detail=data?.error?.message||data?.message||`浏览器直连火山失败（HTTP ${resp.status}）`;
    throw new Error(detail);
  }
  const message=data?.choices?.[0]?.message||{};
  const text=typeof message.content==='string'?message.content:(typeof message.reasoning_content==='string'?message.reasoning_content:'');
  if(!text.trim()) throw new Error('浏览器已连接火山，但模型没有返回文字；请确认该 Model ID 已开通 Chat API');
  return {ok:true,provider:'doubao',model,message:'DeepSeek 浏览器直连正常（已绕开 Cloudflare 525）'};
}

async function saveAndTestApiSettings(){
  readApiSettingsForm(); saveSettings(); providerHealth={}; updateApiStatus();
  const button=document.getElementById('test-connections-btn'); if(button){button.disabled=true;button.textContent='正在检测…';}
  const configured=[state.settings.geminiKey&&'gemini',state.settings.arkKey&&'doubao',state.settings.qwenKey&&'qwen',state.settings.openaiKey&&'openai'].filter(Boolean);
  if(!configured.length){ toast('请至少填写一个 API Key','warn'); if(button){button.disabled=false;button.textContent='保存并检测';} return; }
  await Promise.all(configured.map(async provider=>{
    try{
      const data=await apiCall('/api/connection-test',{provider,arkTextModel:state.settings.arkTextModel||undefined,openaiTextModel:state.settings.openaiTextModel||undefined,visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined,qwenTextModel:state.settings.qwenTextModel||undefined,qwenEndpoint:state.settings.qwenEndpoint||undefined});
      providerHealth[provider]={ok:true,message:data.message||'连接正常'};
    }catch(error){
      if(provider==='doubao'&&String(error.message||'').includes('HTTP 525')){
        try{
          const data=await directArkConnectionTest();
          providerHealth[provider]={ok:true,message:data.message};
        }catch(directError){providerHealth[provider]={ok:false,message:'Cloudflare线路525；'+directError.message};}
      }else if(provider==='qwen'&&isQwenTlsFailure(error)){
        try{
          const data=await directQwenConnectionTest();
          providerHealth[provider]={ok:true,message:data.message};
        }catch(directError){providerHealth[provider]={ok:false,message:'Cloudflare线路525；'+directError.message};}
      }else providerHealth[provider]={ok:false,message:error.message};
    }
    const results=document.getElementById('connection-results'); if(results) results.innerHTML=connectionResultsHtml(); updateApiStatus();
  }));
  if(button){button.disabled=false;button.textContent='重新检测';}
  const failed=configured.filter(provider=>!providerHealth[provider]?.ok);
  if(providerHealth.qwen?.ok) toolSession.textProvider='qwen';
  else if(providerHealth.doubao?.ok) toolSession.textProvider='doubao';
  else if(providerHealth.gemini?.ok) toolSession.textProvider='gemini';
  else if(providerHealth.openai?.ok) toolSession.textProvider='openai';
  renderMain();
  toast(failed.length?`${failed.length} 个模型连接未通过，请查看错误码`:'已填写的模型连接全部通过',failed.length?'error':'success');
}
function clearApiSettings(){
  state.settings={arkKey:'',arkTextModel:'',openaiKey:'',openaiTextModel:'',geminiKey:'',qwenKey:'',qwenEndpoint:'https://dashscope.aliyuncs.com',visionModel:'',imageModel:'',openaiImageModel:'',geminiTextModel:'',geminiImageModel:'',qwenTextModel:'',qwenVisionModel:'',qwenImageModel:'',imageFallback:false};

function updateApiStatus(){
  const el=document.getElementById('api-status');
  const providers=[state.settings.geminiKey&&['gemini','Gemini'],state.settings.arkKey&&['doubao','火山方舟'],state.settings.qwenKey&&['qwen','千问'],state.settings.openaiKey&&['openai','OpenAI']].filter(Boolean);
  if(!providers.length){el.textContent='❌ 未配置API';return;}
  const checked=providers.filter(([id])=>providerHealth[id]);
  const failed=checked.filter(([id])=>!providerHealth[id].ok);
  if(failed.length) el.textContent='⚠️ '+failed.map(([,label])=>label).join('、')+'连接失败';
  else if(checked.length===providers.length) el.textContent='✅ '+providers.map(([,label])=>label).join(' + ')+' 已连接';
  else el.textContent='⚪ 已填写API，等待检测';
}

async function viewHistoryDetail(id){
  const records=await idbAll();
  const r=records.find(x=>x.id===id); if(!r) return;
  showModal(`
    <div class="modal-title">${esc(r.name)} - 详情</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${{taobao:'淘宝',pdd:'拼多多','1688':'1688'}[r.platform]||r.platform||'图片工具'} · ${formatTime(r.createdAt)}${r.kind==='tool'?' · 保存24小时':''}</div>
    ${r.whiteImage?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">白底基准图</div><img src="${r.whiteImage}" style="max-width:150px;border-radius:8px"></div>`:''}
    <div class="gen-list">
      ${r.series.map((s,i)=>`<div class="gen-item">
        <div class="gen-item-img">${s.image?`<img src="${s.image}">`:'<div class="gen-item-placeholder">无图</div>'}</div>
        <div class="gen-item-info"><div class="gen-item-label">${i+1}. ${esc(s.label)}</div>${s.image?`<div class="gen-item-actions"><button class="btn btn-sm" onclick="downloadHistoryImg('${r.id}',${i})">下载</button></div>`:''}</div>

    </div>

async function deleteHistory(id){
  if(!confirm('删除该历史记录？')) return;
  await idbDel(id); showHistory(); toast('已删除','success');
}
async function downloadHistoryImg(id,idx){
  const records=await idbAll(); const r=records.find(x=>x.id===id); if(!r) return;
  const s=r.series[idx]; if(!s||!s.image) return;
  try{await saveDownloadedFile(await imageSourceBlob(s.image),`${r.name}_${idx+1}_${s.label}.png`,downloadProjectFolder(r.name,r.projectNumber));}catch(error){toast('下载失败：'+error.message,'error');}
}
async function downloadHistoryZip(id){
  const records=await idbAll(); const r=records.find(x=>x.id===id); if(!r) return;
  const imgs=r.series.filter(s=>s.image); if(!imgs.length){ toast('无可下载图片','warn'); return; }
  toast('正在打包ZIP...','');
  try{
    if(typeof JSZip==='undefined'){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    const zip=new JSZip();
    for(let i=0;i<imgs.length;i++) zip.file(`${r.name}_${String(i+1).padStart(2,'0')}_${imgs[i].label}.png`,await imageSourceBlob(imgs[i].image));
    const saved=await saveDownloadedFile(await zip.generateAsync({type:'blob'}),`${r.name}_套图.zip`,downloadProjectFolder(r.name,r.projectNumber));
    toast(saved.folder?`ZIP 已保存到 ${saved.folder}`:'ZIP下载完成','success');
  }catch(err){ toast('ZIP打包失败','error'); }
}
