<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>AI商品图片工作台</title>
<style>
:root{
  --bg:#f6f0e5;--card:#fffaf1;--border:#ddcdb8;--text:#3b2b21;--sub:#796556;--light:#a18b79;
  --primary:#8a5a3b;--primary-bg:#f1e2cf;--success:#6f7d48;--success-bg:#edf0df;
  --warn:#d97706;--warn-bg:#fef3e6;--danger:#dc2626;--danger-bg:#fce8e8;
  --sidebar:#4a3125;--accent:#d8aa74;
  --taobao:#ff6a00;--pdd:#e02e24;--a1688:#ff7a00;
  --radius:16px;--shadow:0 8px 28px rgba(29,50,38,.055);--shadow-lg:0 18px 50px rgba(22,44,31,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.app{display:flex;height:100vh;overflow:hidden}

/* === Sidebar === */
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar);color:#f4f0df;border-right:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:100;transition:background .3s ease}
.logo{padding:24px 20px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo svg{flex-shrink:0;color:var(--accent)}.logo small{display:block;font-size:9px;font-weight:400;color:rgba(255,255,255,.65);letter-spacing:.08em}
.catalog-nav{padding:10px}.catalog-btn{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:#d2dfd7;font-size:13px;text-align:left}.catalog-btn:hover,.catalog-btn.active{background:rgba(255,255,255,.12);color:#fff}.nav-section-label{padding:12px 12px 6px;color:rgba(255,255,255,.52);font-size:9px;font-weight:700;letter-spacing:.12em}.category-list{display:flex;flex-direction:column;gap:3px}.category-group{border-radius:9px}.category-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:rgba(255,255,255,.76);font-size:12px;text-align:left;transition:all .15s}.category-btn:hover{background:rgba(255,255,255,.07);color:#fff}.category-btn.active{background:var(--accent);color:var(--sidebar);font-weight:700}.category-icon{width:19px;text-align:center;font-size:14px}.category-count{margin-left:auto;font-size:9px;opacity:.7}.category-chevron{font-size:11px;line-height:1;transition:transform .18s}.category-group.open .category-chevron{transform:rotate(180deg)}.category-tools{max-height:0;overflow:hidden;opacity:0;margin:0 5px;padding-left:26px;border-left:1px solid transparent;transition:max-height .2s ease,opacity .15s ease,margin .2s ease}.category-tools.open{max-height:190px;overflow-y:auto;opacity:1;margin:4px 5px 8px;border-left-color:rgba(255,255,255,.16)}.category-tool{width:100%;display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:6px;color:rgba(255,255,255,.68);font-size:10px;text-align:left}.category-tool:hover,.category-tool.active{background:rgba(255,255,255,.1);color:#fff}.category-tool-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.65;flex-shrink:0}.category-tool span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-section-label{padding:5px 22px 2px;color:rgba(255,255,255,.52);font-size:9px;font-weight:700;letter-spacing:.12em;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.project-list{flex:1;padding:8px 10px 10px;overflow-y:auto}
.project-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:all .15s}
.project-item:hover{background:rgba(255,255,255,.08)}
.project-item.active{background:rgba(255,255,255,.13)}
.project-thumb{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid color-mix(in srgb,var(--accent) 72%,transparent);flex-shrink:0;background:rgba(255,255,255,.1)}
.project-info{flex:1;min-width:0}
.project-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-status{font-size:10px;color:rgba(255,255,255,.62)}.project-delete{opacity:0;color:rgba(255,255,255,.62);padding:5px;font-size:16px;line-height:1}.project-item:hover .project-delete{opacity:1}.project-delete:hover{color:#fff}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}
.status-dot.idle{background:var(--light)}
.status-dot.running{background:var(--primary);box-shadow:0 0 0 2px rgba(255,255,255,.28);animation:pulse 1.5s infinite}
.status-dot.done{background:#ef233c;box-shadow:0 0 0 2px rgba(239,35,60,.18)}
.status-dot.error{background:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.18)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.12)}
.new-project-btn{width:100%;padding:11px;background:var(--accent);color:var(--sidebar);border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.new-project-btn:hover{filter:brightness(1.06)}
.new-project-btn:disabled{opacity:.55;cursor:not-allowed;background:color-mix(in srgb,var(--accent) 60%,#aaa)}
.project-counter{margin-left:auto;font-size:10px;font-weight:600;opacity:.72}
.history-btn{width:100%;padding:9px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.68);display:flex;align-items:center;justify-content:center;gap:6px}
.history-btn:hover{color:#fff}

/* === Main === */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.topbar .api-status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.topbar .settings-btn{width:36px;height:36px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.topbar .settings-btn:hover{color:var(--primary)}
.engine-pill{font-size:10px;color:var(--primary);border:1px solid var(--border);background:color-mix(in srgb,var(--card) 76%,transparent);border-radius:99px;padding:6px 10px}.engine-pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:6px}
.content{padding:30px;max-width:1080px;width:100%;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:4px 0 22px}.hero h2{font-family:Georgia,"Songti SC",serif;font-size:32px;font-weight:500;letter-spacing:-.03em}.hero p{color:var(--sub);font-size:12px;margin-top:7px}.flow-strip{display:flex;gap:6px;flex-wrap:wrap}.flow-strip span{font-size:10px;border:1px solid var(--border);background:rgba(255,255,255,.55);padding:6px 9px;border-radius:99px;color:var(--sub)}

/* === Cards === */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{color:var(--primary)}
.card-title .actions{margin-left:auto;display:flex;gap:8px}

.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.btn:hover{background:var(--primary-bg);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 86%,#2f1e16);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}

/* === Upload === */
.upload-zone{border:1px dashed var(--border);border-radius:var(--radius);padding:46px 20px;text-align:center;cursor:pointer;transition:all .15s;background:color-mix(in srgb,var(--bg) 68%,var(--card))}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-bg)}
.upload-zone.has-image{padding:0;border-style:solid;border-color:var(--border)}
.upload-zone img{max-width:100%;max-height:300px;border-radius:var(--radius);display:block;margin:0 auto}
.upload-icon{color:var(--light);margin-bottom:8px}
.upload-text{font-size:14px;color:var(--sub)}
.upload-hint{font-size:12px;color:var(--light);margin-top:4px}

/* === Platform & Suite === */
.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.platform-opt{padding:16px 12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500}
.platform-opt:hover{border-color:var(--primary)}
.platform-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.platform-opt .p-icon{font-size:24px;margin-bottom:6px}
.platform-opt .p-desc{font-size:11px;color:var(--light);margin-top:4px;font-weight:400}

.suite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.suite-opt{padding:12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px}
.suite-opt:hover{border-color:var(--primary)}
.suite-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.suite-opt .s-count{font-size:11px;color:var(--light);margin-top:2px}

.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.direction-opt{padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s}
.direction-opt:hover{border-color:var(--primary)}
.direction-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}

.label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.input,textarea.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px}
textarea.input{resize:vertical;min-height:60px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}

/* === Generation Progress === */
.gen-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gen-item{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 5px 20px rgba(30,48,37,.04)}
.gen-item-img{width:100%;aspect-ratio:1;background:var(--bg);position:relative;display:flex;align-items:center;justify-content:center}
.gen-item-img img{width:100%;height:100%;object-fit:cover}
.gen-item-img.vertical img{object-fit:contain}
.gen-item-placeholder{color:var(--light);font-size:12px;text-align:center;padding:20px}
.gen-item-info{padding:8px 10px}
.gen-item-label{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen-item-meta{font-size:10px;color:var(--light);display:flex;align-items:center;gap:4px;margin-top:2px}
.gen-item-actions{display:flex;gap:4px;margin-top:6px}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-success{background:var(--success-bg);color:var(--success)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-info{background:var(--primary-bg);color:var(--primary)}
.tag-default{background:#f0f1f3;color:var(--sub)}

.progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}.phase-box{background:var(--primary-bg);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:14px}.phase-box strong{display:block;font-size:12px}.phase-box p{font-size:10px;color:var(--sub);margin-top:3px}

/* === Modal === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadow-lg);margin:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.form-group{margin-bottom:14px}

/* === Toast === */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;border-left:4px solid var(--primary);animation:slideIn .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* === History === */
.history-item{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.history-item:hover{border-color:var(--primary)}
.history-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0}
.history-info{flex:1}
.history-title{font-size:13px;font-weight:500}
.history-meta{font-size:11px;color:var(--light);margin-top:2px}

.empty{text-align:center;padding:40px 20px;color:var(--light);font-size:13px}
.section-desc{font-size:12px;color:var(--sub);margin-bottom:14px}

/* === Creative tool center === */
.catalog-hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--sidebar) 0%,var(--primary) 62%,var(--accent) 170%);color:#fff;margin-bottom:20px;position:relative;overflow:hidden;transition:background .3s ease}.catalog-hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-130px;background:rgba(255,255,255,.09)}.catalog-hero h2{font-family:Georgia,"Songti SC",serif;font-size:30px;font-weight:500}.catalog-hero p{margin-top:7px;color:rgba(255,255,255,.78);max-width:620px;font-size:13px}.catalog-tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 12px;margin-bottom:8px}.catalog-tab{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.62);font-size:13px;color:var(--sub)}.catalog-tab:hover{border-color:var(--primary);color:var(--primary)}.catalog-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tool-card{min-height:190px;border-radius:18px;border:1px solid var(--border);background:var(--card);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}.tool-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(78,48,32,.12);border-color:var(--primary)}.tool-art{height:108px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#f4e8d7,#e7d1b5)}.tool-art:before,.tool-art:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.55)}.tool-art:before{width:120px;height:120px;right:-20px;top:-45px}.tool-art:after{width:70px;height:70px;left:-16px;bottom:-25px}.tool-art span{font-size:48px;filter:drop-shadow(0 8px 12px rgba(82,50,30,.16));z-index:1}.tool-card:nth-child(4n+2) .tool-art{background:linear-gradient(135deg,#f1e4d5,#dcc2a7)}.tool-card:nth-child(4n+3) .tool-art{background:linear-gradient(135deg,#efe5d8,#dfcdbd)}.tool-card:nth-child(4n+4) .tool-art{background:linear-gradient(135deg,#f6ead6,#e8cfaa)}.tool-copy{padding:14px 16px 16px}.tool-copy h3{font-size:15px}.tool-copy p{font-size:11px;color:var(--sub);line-height:1.55;margin-top:4px}.tool-badge{display:inline-flex;margin-top:9px;padding:2px 7px;border-radius:99px;font-size:9px;background:var(--primary-bg);color:var(--primary)}
.catalog-quick-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 24px}.quick-category{min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:9px 12px;display:flex;align-items:center;gap:8px;text-align:left;color:var(--sub);box-shadow:0 3px 12px rgba(22,44,31,.035);transition:all .15s}.quick-category:hover{border-color:var(--primary);color:var(--primary)}.quick-category.active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary);font-weight:700}.quick-category .quick-icon{width:20px;text-align:center}.quick-category .quick-count{margin-left:auto;font-size:10px;opacity:.65}.catalog-section{scroll-margin-top:82px;margin:0 0 34px}.catalog-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 13px;padding-bottom:9px;border-bottom:1px solid var(--border)}.catalog-section-head h2{font-size:22px}.catalog-section-head p{font-size:11px;color:var(--light)}
.tool-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.tool-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:20px}.tool-head h2{font-size:24px}.tool-head p{font-size:12px;color:var(--sub)}.tool-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:16px}.tool-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.tool-upload{min-height:190px;border:1px dashed var(--border);border-radius:13px;background:color-mix(in srgb,var(--bg) 68%,var(--card));display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer}.tool-upload:hover{border-color:var(--primary);background:var(--primary-bg)}.tool-preview-grid,.tool-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool-preview,.tool-result{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}.tool-preview img,.tool-result img{width:100%;aspect-ratio:1;display:block;object-fit:cover}.tool-preview button{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(59,43,33,.78);color:#fff}.tool-result .result-actions{padding:8px}.tool-text-result{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--bg) 68%,var(--card));border:1px solid var(--border);border-radius:12px;padding:16px;min-height:230px;font-size:13px;line-height:1.8}.tool-empty{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--light);font-size:12px;border:1px dashed var(--border);border-radius:12px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool-run{width:100%;justify-content:center;padding:12px;margin-top:14px;font-size:14px}
.workflow-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.workflow-step{padding:9px 11px;border-radius:10px;border:1px solid var(--border);font-size:11px;color:var(--light);background:var(--bg)}.workflow-step.ready{border-color:var(--success);background:var(--success-bg);color:var(--success)}.prompt-editor{margin-top:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--bg) 66%,var(--card))}.prompt-editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.prompt-editor-head strong{font-size:12px}.prompt-summary{font-size:10px;color:var(--sub);line-height:1.55;margin-bottom:9px}.prompt-item{margin-top:9px}.prompt-item label{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:4px}.prompt-item textarea{min-height:112px;font-size:11px;line-height:1.55}.model-note{font-size:10px;color:var(--light);margin-top:4px}.input-rule{margin:9px 0 0;padding:9px 11px;border-radius:9px;background:var(--primary-bg);color:var(--primary);font-size:10px;line-height:1.55}.tool-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tool-actions .tool-run{margin-top:0}.provider-free{color:var(--success);font-weight:600}

/* === Project prompt assistant === */
.project-prompt-card{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--primary) 42%,var(--border));background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--primary-bg) 45%,var(--card)))}
.project-prompt-card:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-105px;top:-120px;background:color-mix(in srgb,var(--accent) 22%,transparent);pointer-events:none}

/* ============ IndexedDB ============ */
let idb=null;
function openIDB(){
  return new Promise((resolve)=>{
    if(idb) return resolve(idb);
    const req=indexedDB.open('ai_img_history',1);
    req.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'}); };
    req.onsuccess=e=>{ idb=e.target.result; resolve(idb); };
    req.onerror=()=>resolve(null);
  });
}
async function idbAdd(rec){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }
async function idbAll(){ const db=await openIDB(); if(!db)return []; return new Promise(r=>{ const tx=db.transaction('records','readonly'); const req=tx.objectStore('records').getAll(); req.onsuccess=()=>r(req.result||[]); req.onerror=()=>r([]); }); }
async function idbDel(id){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }

/* ============ TOAST ============ */
function toast(msg,type){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 4000);
}

/* ============ UTILS ============ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fileToBase64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
function base64ToBlob(b64){
  const parts=b64.split(','); const mime=parts[0].match(/:(.*?);/)[1]; const data=atob(parts[1]);
  const arr=new Uint8Array(data.length); for(let i=0;i<data.length;i++)arr[i]=data.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function formatTime(t){ const d=new Date(t); return d.getMonth()+1+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function setupCategoryObserver(){
  if(categoryObserver) categoryObserver.disconnect();
  const root=document.querySelector('.main');
  categoryObserver=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(!visible.length) return;
    const id=visible[0].target.dataset.category;
    if(id&&id!==activeCategory){ activeCategory=id; syncCategoryNav(); }
  },{root,rootMargin:'-18% 0px -70% 0px',threshold:0});
  document.querySelectorAll('.catalog-section').forEach(section=>categoryObserver.observe(section));
}

}

function projectHasWhiteOutput(p){ return p.suiteType!=='vertical'; }
function projectTextProvider(p){ return p.textProvider||(state.settings.geminiKey?'gemini':state.settings.arkKey?'doubao':'gemini'); }
function projectImageProvider(p){ return p.imageProvider||(state.settings.geminiKey?'gemini':state.settings.arkKey?'seedream':state.settings.openaiKey?'openai':'gemini'); }
function hasProjectTextKey(p){ return projectTextProvider(p)==='gemini'?Boolean(state.settings.geminiKey):Boolean(state.settings.arkKey); }
function hasProjectImageKey(p){ const provider=projectImageProvider(p);return provider==='gemini'?Boolean(state.settings.geminiKey):provider==='openai'?Boolean(state.settings.openaiKey):Boolean(state.settings.arkKey); }
function setProjectTextProvider(value){ const p=getCurrentProject();if(!projectEditable(p))return;p.textProvider=value;resetProjectPlan(p);renderMain();renderProjectList(); }
function setProjectImageProvider(value){ const p=getCurrentProject();if(!projectEditable(p))return;p.imageProvider=value;resetProjectPlan(p);renderMain();renderProjectList(); }
function updateProjectWhitePrompt(value){

function updateProjectPrompt(index,value){ const p=getCurrentProject(); if(p?.series[index]) p.series[index].prompt=value; }

/* ============ SETTERS ============ */
function projectEditable(p){ if(p?.status==='running'){ toast('当前任务运行中，请完成后再修改设置','warn'); return false; } return Boolean(p); }
function resetProjectPlan(p){ if(!p) return; p.analysis=null;p.whiteImage='';p.series=[];p.qcResults=[];p.status='idle';p.phase='设置已改变，请重新生成提示词'; }
function setPlatform(k){ const p=getCurrentProject(); if(projectEditable(p)){resetProjectPlan(p);p.platform=k;renderMain();renderProjectList();} }
function setSuiteType(k){ const p=getCurrentProject(); if(projectEditable(p)){resetProjectPlan(p);p.suiteType=k;renderMain();renderProjectList();} }
function setDirection(k){ const p=getCurrentProject(); if(projectEditable(p)){resetProjectPlan(p);p.direction=k;renderMain();renderProjectList();} }
function updateNote(){ const p=getCurrentProject(); if(!projectEditable(p)){renderMain();return;} p.userNote=document.getElementById('user-note').value;resetProjectPlan(p);document.getElementById('project-prompt-plan')?.remove();document.getElementById('project-analysis')?.remove();const tag=document.getElementById('project-prompt-state');if(tag){tag.className='tag tag-info';tag.textContent='需求已修改';}const step=document.getElementById('project-prompt-step');if(step){step.classList.remove('ready');step.textContent='① 请重新生成整套提示词';}const button=document.getElementById('project-generate-btn');if(button)button.disabled=true; }

async function handleUpload(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>8*1024*1024){ toast('图片超过8MB限制','error'); return; }
  const validTypes=['image/jpeg','image/png','image/webp'];
  if(!validTypes.includes(file.type)){ toast('图片格式错误，支持JPG/PNG/WebP','error'); return; }
  const p=getCurrentProject(); if(!p) return;
  try{
    const b64=await fileToBase64(file);
    p.image=b64; p.name=file.name.replace(/\.[^.]+$/,'').slice(0,20)||p.name;
    p.analysis=null; p.whiteImage=''; p.series=[]; p.qcResults=[]; p.status='idle'; p.phase='商品图已上传，等待选择生成方向';
    renderProjectList(); renderMain();
    toast('图片上传成功','success');
  }catch(err){ toast('图片读取失败','error'); }
}

/* ============ API CALLS ============ */
async function apiCall(path,data,extraHeaders){
  const headers={'Content-Type':'application/json','X-Request-Id':uid(),...(extraHeaders||{})};
  if(state.settings.arkKey) headers['X-Ark-Key']=state.settings.arkKey;
  if(state.settings.openaiKey) headers['X-OpenAI-Key']=state.settings.openaiKey;
  if(state.settings.geminiKey) headers['X-Gemini-Key']=state.settings.geminiKey;
  const resp=await fetch(getApiBase()+path,{method:'POST',headers,body:JSON.stringify(data)});
  const raw=await resp.text();
  let json={};
  try{ json=raw?JSON.parse(raw):{}; }catch(e){ throw new Error('服务器返回格式异常（HTTP '+resp.status+'）'); }
  if(!resp.ok) throw new Error(json.error||'请求失败（HTTP '+resp.status+'）');
  return json;
}

/* ============ CREATIVE TOOLS ============ */
async function handleToolUpload(event){
  const tool=TOOLS.find(item=>item.id===activeTool); if(!tool) return;
  const incoming=Array.from(event.target.files||[]);
  const room=Math.max(0,tool.maxFiles-toolSession.files.length);
  const selected=incoming.slice(0,room);
  const valid=[];
  const fileLimit=(tool.maxFiles>4?2.5:8)*1024*1024;
  for(const file of selected){
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){ toast(file.name+' 格式不支持','error'); continue; }
    if(file.size>fileLimit){ toast(file.name+' 体积过大','error'); continue; }
    try{ valid.push(await fileToBase64(file)); }catch(error){ toast(file.name+' 读取失败','error'); }
  }
  toolSession.files=toolSession.files.concat(valid).slice(0,tool.maxFiles);
  toolSession.results=[]; toolSession.text=''; toolSession.prompts=[]; toolSession.promptSummary=''; event.target.value=''; renderToolWorkspace();
}
function removeToolFile(index){ toolSession.files.splice(index,1); toolSession.results=[]; toolSession.prompts=[]; toolSession.promptSummary=''; renderToolWorkspace(); }
function validToolInput(tool){
  if(toolSession.files.length<(tool.minFiles||0)){ toast(`此工具至少需要上传${tool.minFiles}张图片`,'warn'); return false; }
  if(!toolSession.note.trim()&&!toolSession.files.length){ toast('请填写任务信息或上传参考图','warn'); return false; }
  return true;
}
function hasSelectedTextKey(){ return toolSession.textProvider==='gemini'?Boolean(state.settings.geminiKey):Boolean(state.settings.arkKey); }
async function runTextTool(){
  const tool=TOOLS.find(item=>item.id===activeTool); if(!tool||toolSession.running) return;
  if(!validToolInput(tool)) return;
  if(!hasSelectedTextKey()){ toast('所选文字模型尚未配置API Key','warn'); showSettings(); return; }
  toolSession.running=true; toolSession.text=''; renderToolWorkspace();
  try{
    const data=await apiCall('/api/tool-text',{toolId:tool.id,note:toolSession.note,imageBase64s:toolSession.files,textProvider:toolSession.textProvider,visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
    toolSession.text=data.text||''; toast('文字生成完成','success');
  }catch(error){ toast('处理失败：'+error.message,'error'); }
  finally{ toolSession.running=false; renderToolWorkspace(); }
}
async function generateToolPrompts(){
  const tool=TOOLS.find(item=>item.id===activeTool); if(!tool||toolSession.running||!validToolInput(tool)) return;
  if(!hasSelectedTextKey()){ toast('所选文字模型尚未配置API Key','warn'); showSettings(); return; }
  toolSession.running=true; toolSession.prompts=[]; toolSession.results=[]; renderToolWorkspace();
  try{
    const data=await apiCall('/api/tool-prompt',{toolId:tool.id,note:toolSession.note,imageBase64s:toolSession.files,inputHint:tool.inputHint||'',outputCount:desiredOutputCount(tool),aspect:toolSession.aspect,provider:toolSession.provider,textProvider:toolSession.textProvider,visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
    toolSession.prompts=data.prompts||[]; toolSession.promptSummary=data.summary||''; toast('提示词已生成，请检查后再生图','success');
  }catch(error){ toast('提示词生成失败：'+error.message,'error'); }
  finally{ toolSession.running=false; renderToolWorkspace(); }
}
function generationUnits(tool){
  if(tool.batchByInput) return toolSession.files.map(image=>[image]);
  if(tool.referenceFirst) return toolSession.files.slice(1).map(image=>[toolSession.files[0],image]);
  return Array.from({length:desiredOutputCount(tool)},()=>toolSession.files.slice());
}
async function generateToolImages(){
  const tool=TOOLS.find(item=>item.id===activeTool); if(!tool||toolSession.running||!validToolInput(tool)) return;
  if(!toolSession.prompts.length||toolSession.prompts.some(item=>!item.prompt.trim())){ toast('请先生成并检查完整提示词','warn'); return; }
  const hasKey=toolSession.provider==='gemini'?state.settings.geminiKey:toolSession.provider==='openai'?state.settings.openaiKey:state.settings.arkKey;
  if(!hasKey){ toast('所选图片模型尚未配置API Key','warn'); showSettings(); return; }
  const units=generationUnits(tool); toolSession.running=true; toolSession.results=[]; renderToolWorkspace();
  try{
    for(let i=0;i<toolSession.prompts.length;i++){
      const refs=units[i]||units[units.length-1]||[];
      const data=await apiCall('/api/tool-image',{toolId:tool.id,prompt:toolSession.prompts[i].prompt,imageBase64s:refs,aspect:toolSession.aspect,provider:toolSession.provider,imageModel:state.settings.imageModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined,geminiImageModel:state.settings.geminiImageModel||undefined});
      if(data.image) toolSession.results.push(data.image); renderToolWorkspace();
    }
    toast('图片生成完成','success');
  }catch(error){ toast('图片生成失败：'+error.message,'error'); }
  finally{ toolSession.running=false; renderToolWorkspace(); }
}
function downloadToolResult(index){
  const src=toolSession.results[index]; const tool=TOOLS.find(item=>item.id===activeTool); if(!src||!tool) return;
  downloadBlob(base64ToBlob(src),`${tool.name}_${index+1}.jpg`);
}
async function copyToolText(){
  if(!toolSession.text) return;

  catch(error){ toast('复制失败，请手动选择文本','warn'); }

/* ============ GENERATION FLOW ============ */
const OUTPUT_LABELS={square:['白底商品主图','核心卖点场景','材质做工细节','尺寸使用感知','转化留白构图'],vertical:['首屏卖点概览','核心结构功能','材质工艺证明','尺寸适配说明','使用场景收尾'],full:['白底商品主图','核心卖点场景','材质做工细节','尺寸使用感知','转化留白构图','首屏卖点概览','核心结构功能','材质工艺证明','尺寸适配说明','使用场景收尾']};
function modelOptions(p){ return {provider:projectImageProvider(p),imageModel:state.settings.imageModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined,geminiImageModel:state.settings.geminiImageModel||undefined}; }
function outputAspect(p,index){ return p.suiteType==='vertical'||(p.suiteType==='full'&&index>=5)?'vertical':'square'; }

async function generateOneTask(p,task,index){
  const item=p.series[index];
  item.prompt=task.prompt; item.status='running';
  p.phase='正在生成第 '+(index+1)+' 张：'+item.label;
  renderMain(); renderProjectList();
  try{
    const aspect=outputAspect(p,index);
    const imgResp=await apiCall('/api/series-image',{prompt:task.prompt,whiteImageBase64:p.whiteImage,aspect,...modelOptions(p)});
    item.image=imgResp.image; item.model=imgResp.model; item.status='done';
    if(imgResp.fallback) toast('图'+(index+1)+'已自动切换豆包完成','warn');
    p.phase='正在质检第 '+(index+1)+' 张：'+item.label;
    renderMain();
    try{
      let qc=await apiCall('/api/qc',{whiteImageBase64:p.whiteImage,generatedImageBase64:item.image,taskLabel:item.label,platform:p.platform,textProvider:projectTextProvider(p),visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
      p.qcResults[index]=qc;
      if(!qc.pass){
        toast('图'+(index+1)+'未通过质检，正在自动修正重做','warn');
        p.phase='第 '+(index+1)+' 张质检未通过，正在自动重做'; renderMain();
        const correction=(qc.correction||qc.summary||'恢复商品真实外观并移除错误元素').slice(0,300);
        const redoResp=await apiCall('/api/series-image',{prompt:task.prompt+'\n质检修正要求：'+correction,whiteImageBase64:p.whiteImage,aspect,...modelOptions(p)});
        item.image=redoResp.image; item.model=redoResp.model+'-redo';
        const qc2=await apiCall('/api/qc',{whiteImageBase64:p.whiteImage,generatedImageBase64:item.image,taskLabel:item.label,platform:p.platform,textProvider:projectTextProvider(p),visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
        qc2.redone=true; p.qcResults[index]=qc2;
      }
    }catch(qcError){
      p.qcResults[index]={pass:false,score:0,summary:'自动质检暂时未完成，建议人工复核',correction:''};
      toast('图'+(index+1)+'质检暂未完成','warn');
    }
  }catch(error){
    item.status='error';
    toast('图'+(index+1)+'生成失败：'+error.message,'error');
  }
  renderMain(); renderProjectList();
}

async function runPool(tasks,limit){
  let cursor=0;
  async function worker(){ while(cursor<tasks.length){ const task=tasks[cursor++]; await task(); } }
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},worker));
}

async function planProjectPrompts(){
  const p=getCurrentProject(); if(!p||!p.image) return;
  if(!hasProjectTextKey(p)){ toast('请先配置所选文字模型的 API Key','warn'); showSettings(); return; }
  const labels=OUTPUT_LABELS[p.suiteType];
  p.series=labels.map((label,index)=>({id:index,label,prompt:'',image:'',status:'pending',model:''}));
  p.qcResults=[]; p.status='running'; p.phase='正在识别商品并规划整套提示词'; p.whiteImage=''; p.analysis=null;
  renderMain(); renderProjectList();
  try{
    toast('正在识别商品并制定平台提示词...','');
    const analysis=await apiCall('/api/analyze',{imageBase64:p.image,platform:p.platform,suiteType:p.suiteType,direction:p.direction,userNote:p.userNote,textProvider:projectTextProvider(p),imageProvider:projectImageProvider(p),visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
    p.analysis=analysis;
    const hasWhiteOutput=p.suiteType!=='vertical';
    const plans=analysis.series||[];
    const offset=hasWhiteOutput?1:0;
    if(hasWhiteOutput) p.series[0].prompt=analysis.white_prompt;
    plans.forEach((task,i)=>{ if(p.series[i+offset]) p.series[i+offset].prompt=task.prompt; });
    if(p.series.some(item=>!item.prompt)) throw new Error('提示词数量不完整，请重新规划');
    p.status='idle'; p.phase='整套提示词已生成，等待检查与确认';
    renderMain(); renderProjectList(); toast('提示词已生成，请逐条检查后再生图','success');
  }catch(error){
    p.status='error'; p.phase='提示词规划失败'; p.analysis=null; p.series=[]; renderMain(); renderProjectList();
    toast('提示词生成失败：'+error.message,'error');
  }
}

async function generateProjectImages(){
  const p=getCurrentProject(); if(!p||!p.image||!p.analysis) return;
  if(!hasProjectImageKey(p)){ toast('请先配置所选图片模型的 API Key','warn'); showSettings(); return; }
  if(!p.analysis.white_prompt?.trim()||p.series.some(item=>!item.prompt?.trim())){ toast('请补全所有图片提示词','warn'); return; }
  const labels=OUTPUT_LABELS[p.suiteType];
  p.series.forEach(item=>{ item.image='';item.status='pending';item.model=''; });
  p.qcResults=[]; p.status='running'; p.phase='正在根据已确认提示词制作白底基准图'; p.whiteImage='';
  renderMain(); renderProjectList();
  try{
    const whiteResp=await apiCall('/api/white-image',{prompt:p.analysis.white_prompt,imageBase64:p.image,...modelOptions(p)});
    p.whiteImage=whiteResp.image;
    const hasWhiteOutput=projectHasWhiteOutput(p);
    if(hasWhiteOutput){
      p.series[0]={...p.series[0],prompt:p.analysis.white_prompt,image:whiteResp.image,status:'done',model:whiteResp.model||projectImageProvider(p)};
      p.qcResults[0]={pass:true,score:100,summary:'白底基准图',correction:''};
    }
    renderMain(); renderProjectList();
    const offset=hasWhiteOutput?1:0;
    const jobs=p.series.slice(offset).map((item,i)=>()=>generateOneTask(p,{label:labels[i+offset],prompt:item.prompt},i+offset));
    await runPool(jobs,2);

    const doneCount=p.series.filter(item=>item.image).length;
    p.status=doneCount===labels.length?'done':'error';
    p.phase=doneCount===labels.length?'整套图片已生成并完成质检':'部分图片未完成，可单张重做';
    renderMain(); renderProjectList();
    if(doneCount){
      await idbAdd({id:p.id,name:p.name,platform:p.platform,suiteType:p.suiteType,direction:p.direction,whiteImage:p.whiteImage,series:p.series.map(item=>({label:item.label,image:item.image,model:item.model,prompt:item.prompt})),qcResults:p.qcResults,createdAt:Date.now()});
      toast((doneCount===labels.length?'整套生成完成！':'生成完成，部分图片需要重做。')+' 已保存到历史记录',doneCount===labels.length?'success':'warn');
    }
  }catch(error){
    p.status='error'; p.phase='任务中断'; renderMain(); renderProjectList();
    toast('生成失败：'+error.message,'error');
  }
}

async function regenSingle(idx){
  const p=getCurrentProject(); if(!p||!p.whiteImage) return;
  const item=p.series[idx]; if(!item||!item.prompt) return;
  if(projectHasWhiteOutput(p)&&idx===0){ toast('白底主图需要重新运行整套任务','warn'); return; }
  item.status='running'; item.image=''; p.qcResults[idx]=null; renderMain();
  await generateOneTask(p,{label:item.label,prompt:item.prompt},idx);
  toast(item.image?'图'+(idx+1)+'重新生成完成':'图'+(idx+1)+'重新生成失败',item.image?'success':'error');
}

/* ============ DOWNLOAD ============ */
function downloadSingle(idx){
  const p=getCurrentProject(); if(!p) return;
  const s=p.series[idx]; if(!s||!s.image) return;
  const blob=base64ToBlob(s.image);
  downloadBlob(blob,`${p.name}_${idx+1}_${s.label}.png`);
}
async function downloadAll(){
  const p=getCurrentProject(); if(!p) return;
  const imgs=p.series.filter(s=>s.image);
  const expected=p.suiteType==='full'?10:5;
  if(imgs.length<expected){ toast('需要'+expected+'张图才能下载整套，当前'+imgs.length+'张','warn'); return; }
  toast('正在打包ZIP...','');
  try{
    if(typeof JSZip==='undefined'){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    const zip=new JSZip();
    imgs.forEach((s,i)=>{ const blob=base64ToBlob(s.image); zip.file(`${p.name}_${String(i+1).padStart(2,'0')}_${s.label}.png`,blob); });
    const content=await zip.generateAsync({type:'blob'});
    downloadBlob(content,`${p.name}_套图.zip`);
    toast('ZIP下载完成','success');
  }catch(err){ toast('ZIP打包失败：'+err.message,'error'); }
}
function loadScript(src){ return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); }); }

    <div style="max-height:60vh;overflow-y:auto">
      ${records.length?records.map(r=>`
        <div class="history-item" onclick="viewHistoryDetail('${r.id}')">
          ${r.whiteImage?`<img class="history-thumb" src="${r.whiteImage}">`:`<div class="history-thumb" style="background:var(--bg)"></div>`}
          <div class="history-info">
            <div class="history-title">${esc(r.name)}</div>
            <div class="history-meta">${{taobao:'淘宝',pdd:'拼多多','1688':'1688'}[r.platform]||r.platform} · ${r.series.length}张 · ${formatTime(r.createdAt)}</div>
          </div>
          <button class="btn btn-sm" onclick="event.stopPropagation();deleteHistory('${r.id}')">删除</button>
