<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>AI商品图片工作台</title>
<style>
:root{
  --bg:#f5fbf7;--card:#fffefa;--border:#d8e8df;--text:#294052;--sub:#607989;--light:#91a7b2;
  --primary:#4f91d4;--primary-bg:#e8f4ff;--success:#55a97b;--success-bg:#e9f8ef;
  --warn:#d97706;--warn-bg:#fef3e6;--danger:#dc2626;--danger-bg:#fce8e8;
  --sidebar:#6fa8dc;--accent:#ffe08a;
  --taobao:#ff6a00;--pdd:#e02e24;--a1688:#ff7a00;
  --radius:16px;--shadow:0 8px 28px rgba(29,50,38,.055);--shadow-lg:0 18px 50px rgba(22,44,31,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.app{display:flex;height:100vh;overflow:hidden}

/* === Sidebar === */
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar);color:#f4f0df;border-right:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:100;transition:background .3s ease}
.logo{padding:24px 20px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo svg{flex-shrink:0;color:var(--accent)}.logo small{display:block;font-size:9px;font-weight:400;color:rgba(255,255,255,.65);letter-spacing:.08em}
.catalog-nav{padding:10px}.catalog-btn{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:#d2dfd7;font-size:13px;text-align:left}.catalog-btn:hover,.catalog-btn.active{background:rgba(255,255,255,.12);color:#fff}.nav-section-label{padding:12px 12px 6px;color:rgba(255,255,255,.52);font-size:9px;font-weight:700;letter-spacing:.12em}.category-list{display:flex;flex-direction:column;gap:3px}.category-group{border-radius:9px}.category-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:rgba(255,255,255,.76);font-size:12px;text-align:left;transition:all .15s}.category-btn:hover{background:rgba(255,255,255,.07);color:#fff}.category-btn.active{background:var(--accent);color:var(--sidebar);font-weight:700}.category-icon{width:19px;text-align:center;font-size:14px}.category-count{margin-left:auto;font-size:9px;opacity:.7}.category-chevron{font-size:11px;line-height:1;transition:transform .18s}.category-group.open .category-chevron{transform:rotate(180deg)}.category-tools{max-height:0;overflow:hidden;opacity:0;margin:0 5px;padding-left:26px;border-left:1px solid transparent;transition:max-height .2s ease,opacity .15s ease,margin .2s ease}.category-tools.open{max-height:190px;overflow-y:auto;opacity:1;margin:4px 5px 8px;border-left-color:rgba(255,255,255,.16)}.category-tool{width:100%;display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:6px;color:rgba(255,255,255,.68);font-size:10px;text-align:left}.category-tool:hover,.category-tool.active{background:rgba(255,255,255,.1);color:#fff}.category-tool-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.65;flex-shrink:0}.category-tool span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-section-label{padding:5px 22px 2px;color:rgba(255,255,255,.52);font-size:9px;font-weight:700;letter-spacing:.12em;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.project-list{flex:1;padding:8px 10px 10px;overflow-y:auto}
.project-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:all .15s}
.project-item:hover{background:rgba(255,255,255,.08)}
.project-item.active{background:rgba(255,255,255,.13)}
.project-thumb{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid color-mix(in srgb,var(--accent) 72%,transparent);flex-shrink:0;background:rgba(255,255,255,.1)}
.project-info{flex:1;min-width:0}
.project-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-status{font-size:10px;color:rgba(255,255,255,.62)}.project-delete{opacity:0;color:rgba(255,255,255,.62);padding:5px;font-size:16px;line-height:1}.project-item:hover .project-delete{opacity:1}.project-delete:hover{color:#fff}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}
.status-dot.idle{background:var(--light)}
.status-dot.running{background:var(--primary);box-shadow:0 0 0 2px rgba(255,255,255,.28);animation:pulse 1.5s infinite}
.status-dot.done{background:#ef233c;box-shadow:0 0 0 2px rgba(239,35,60,.18)}
.status-dot.error{background:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.18)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.12)}
.new-project-btn{width:100%;padding:11px;background:var(--accent);color:var(--sidebar);border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.new-project-btn:hover{filter:brightness(1.06)}
.new-project-btn:disabled{opacity:.55;cursor:not-allowed;background:color-mix(in srgb,var(--accent) 60%,#aaa)}
.project-counter{margin-left:auto;font-size:10px;font-weight:600;opacity:.72}
.history-btn{width:100%;padding:9px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.68);display:flex;align-items:center;justify-content:center;gap:6px}
.history-btn:hover{color:#fff}

/* === Main === */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.topbar .api-status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.topbar .settings-btn{width:36px;height:36px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.topbar .settings-btn:hover{color:var(--primary)}
.engine-pill{font-size:10px;color:var(--primary);border:1px solid var(--border);background:color-mix(in srgb,var(--card) 76%,transparent);border-radius:99px;padding:6px 10px}.engine-pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:6px}
.content{padding:30px;max-width:1080px;width:100%;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:4px 0 22px}.hero h2{font-family:Georgia,"Songti SC",serif;font-size:32px;font-weight:500;letter-spacing:-.03em}.hero p{color:var(--sub);font-size:12px;margin-top:7px}.flow-strip{display:flex;gap:6px;flex-wrap:wrap}.flow-strip span{font-size:10px;border:1px solid var(--border);background:rgba(255,255,255,.55);padding:6px 9px;border-radius:99px;color:var(--sub)}

/* === Cards === */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{color:var(--primary)}
.card-title .actions{margin-left:auto;display:flex;gap:8px}

.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.btn:hover{background:var(--primary-bg);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 86%,#2f1e16);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}

/* === Upload === */
.upload-zone{border:1px dashed var(--border);border-radius:var(--radius);padding:46px 20px;text-align:center;cursor:pointer;transition:all .15s;background:color-mix(in srgb,var(--bg) 68%,var(--card))}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-bg)}
.upload-zone.has-image{padding:0;border-style:solid;border-color:var(--border)}
.upload-zone img{max-width:100%;max-height:300px;border-radius:var(--radius);display:block;margin:0 auto}
.upload-icon{color:var(--light);margin-bottom:8px}
.upload-text{font-size:14px;color:var(--sub)}
.upload-hint{font-size:12px;color:var(--light);margin-top:4px}

/* === Platform & Suite === */
.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.platform-opt{padding:16px 12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500}
.platform-opt:hover{border-color:var(--primary)}
.platform-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.platform-opt .p-icon{font-size:24px;margin-bottom:6px}
.platform-opt .p-desc{font-size:11px;color:var(--light);margin-top:4px;font-weight:400}

.suite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.suite-opt{padding:12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px}
.suite-opt:hover{border-color:var(--primary)}
.suite-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.suite-opt .s-count{font-size:11px;color:var(--light);margin-top:2px}

.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.direction-opt{padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s}
.direction-opt:hover{border-color:var(--primary)}
.direction-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}

.label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.input,textarea.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px}
textarea.input{resize:vertical;min-height:60px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}

/* === Generation Progress === */
.gen-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gen-item{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 5px 20px rgba(30,48,37,.04)}
.gen-item-img{width:100%;aspect-ratio:1;background:var(--bg);position:relative;display:flex;align-items:center;justify-content:center}
.gen-item-img img{width:100%;height:100%;object-fit:cover}
.gen-item-img.vertical img{object-fit:contain}
.gen-item-placeholder{color:var(--light);font-size:12px;text-align:center;padding:20px}
.gen-item-info{padding:8px 10px}
.gen-item-label{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen-item-meta{font-size:10px;color:var(--light);display:flex;align-items:center;gap:4px;margin-top:2px}
.gen-item-actions{display:flex;gap:4px;margin-top:6px}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-success{background:var(--success-bg);color:var(--success)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-info{background:var(--primary-bg);color:var(--primary)}
.tag-default{background:#f0f1f3;color:var(--sub)}

.progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}.phase-box{background:var(--primary-bg);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:14px}.phase-box strong{display:block;font-size:12px}.phase-box p{font-size:10px;color:var(--sub);margin-top:3px}

/* === Modal === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadow-lg);margin:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.form-group{margin-bottom:14px}
.connection-results{display:grid;gap:7px;margin-top:10px}.connection-result{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:11px}.connection-result strong{min-width:72px}.connection-result span:last-child{color:var(--sub);word-break:break-word}.connection-result.ok{border-color:var(--success);background:var(--success-bg)}.connection-result.fail{border-color:var(--danger);background:var(--danger-bg)}

/* === Toast === */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;border-left:4px solid var(--primary);animation:slideIn .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* === History === */
.history-item{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.history-item:hover{border-color:var(--primary)}
.history-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0}
.history-info{flex:1}
.history-title{font-size:13px;font-weight:500}
.history-meta{font-size:11px;color:var(--light);margin-top:2px}

.empty{text-align:center;padding:40px 20px;color:var(--light);font-size:13px}
.section-desc{font-size:12px;color:var(--sub);margin-bottom:14px}

/* === Creative tool center === */
.catalog-hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--sidebar) 0%,var(--primary) 62%,var(--accent) 170%);color:#fff;margin-bottom:20px;position:relative;overflow:hidden;transition:background .3s ease}.catalog-hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-130px;background:rgba(255,255,255,.09)}.catalog-hero h2{font-family:Georgia,"Songti SC",serif;font-size:30px;font-weight:500}.catalog-hero p{margin-top:7px;color:rgba(255,255,255,.78);max-width:620px;font-size:13px}.catalog-tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 12px;margin-bottom:8px}.catalog-tab{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.62);font-size:13px;color:var(--sub)}.catalog-tab:hover{border-color:var(--primary);color:var(--primary)}.catalog-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tool-card{min-height:190px;border-radius:18px;border:1px solid var(--border);background:var(--card);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}.tool-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(78,48,32,.12);border-color:var(--primary)}.tool-art{height:108px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#f4e8d7,#e7d1b5)}.tool-art:before,.tool-art:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.55)}.tool-art:before{width:120px;height:120px;right:-20px;top:-45px}.tool-art:after{width:70px;height:70px;left:-16px;bottom:-25px}.tool-art span{font-size:48px;filter:drop-shadow(0 8px 12px rgba(82,50,30,.16));z-index:1}.tool-card:nth-child(4n+2) .tool-art{background:linear-gradient(135deg,#f1e4d5,#dcc2a7)}.tool-card:nth-child(4n+3) .tool-art{background:linear-gradient(135deg,#efe5d8,#dfcdbd)}.tool-card:nth-child(4n+4) .tool-art{background:linear-gradient(135deg,#f6ead6,#e8cfaa)}.tool-copy{padding:14px 16px 16px}.tool-copy h3{font-size:15px}.tool-copy p{font-size:11px;color:var(--sub);line-height:1.55;margin-top:4px}.tool-badge{display:inline-flex;margin-top:9px;padding:2px 7px;border-radius:99px;font-size:9px;background:var(--primary-bg);color:var(--primary)}
.catalog-quick-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 24px}.quick-category{min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:9px 12px;display:flex;align-items:center;gap:8px;text-align:left;color:var(--sub);box-shadow:0 3px 12px rgba(22,44,31,.035);transition:all .15s}.quick-category:hover{border-color:var(--primary);color:var(--primary)}.quick-category.active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary);font-weight:700}.quick-category .quick-icon{width:20px;text-align:center}.quick-category .quick-count{margin-left:auto;font-size:10px;opacity:.65}.catalog-section{scroll-margin-top:82px;margin:0 0 34px}.catalog-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 13px;padding-bottom:9px;border-bottom:1px solid var(--border)}.catalog-section-head h2{font-size:22px}.catalog-section-head p{font-size:11px;color:var(--light)}
.tool-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.tool-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:20px}.tool-head h2{font-size:24px}.tool-head p{font-size:12px;color:var(--sub)}.tool-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:16px}.tool-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.tool-upload{min-height:190px;border:1px dashed var(--border);border-radius:13px;background:color-mix(in srgb,var(--bg) 68%,var(--card));display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer}.tool-upload:hover{border-color:var(--primary);background:var(--primary-bg)}.tool-preview-grid,.tool-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool-preview,.tool-result{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}.tool-preview img,.tool-result img{width:100%;aspect-ratio:1;display:block;object-fit:cover}.tool-preview button{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(59,43,33,.78);color:#fff}.tool-result .result-actions{padding:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.result-meta{min-width:0;font-size:9px;color:var(--sub);line-height:1.4}.result-meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}.result-meta .fallback{color:var(--warn)}.tool-text-result{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--bg) 68%,var(--card));border:1px solid var(--border);border-radius:12px;padding:16px;min-height:230px;font-size:13px;line-height:1.8}.tool-empty{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--light);font-size:12px;border:1px dashed var(--border);border-radius:12px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool-run{width:100%;justify-content:center;padding:12px;margin-top:14px;font-size:14px}
.workflow-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.workflow-step{padding:9px 11px;border-radius:10px;border:1px solid var(--border);font-size:11px;color:var(--light);background:var(--bg)}.workflow-step.ready{border-color:var(--success);background:var(--success-bg);color:var(--success)}.prompt-editor{margin-top:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--bg) 66%,var(--card))}.prompt-editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.prompt-editor-head strong{font-size:12px}.prompt-summary{font-size:10px;color:var(--sub);line-height:1.55;margin-bottom:9px}.prompt-item{margin-top:9px}.prompt-item label{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:4px}.prompt-item textarea{min-height:112px;font-size:11px;line-height:1.55}.model-note{font-size:10px;color:var(--light);margin-top:4px}.input-rule{margin:9px 0 0;padding:9px 11px;border-radius:9px;background:var(--primary-bg);color:var(--primary);font-size:10px;line-height:1.55}.tool-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tool-actions .tool-run{margin-top:0}.provider-free{color:var(--success);font-weight:600}

/* === Project prompt assistant === */

/* ============ IndexedDB ============ */
let idb=null;
let downloadFolderName='';
const HISTORY_TTL=24*60*60*1000;
function openIDB(){
  return new Promise((resolve)=>{
    if(idb) return resolve(idb);
    const req=indexedDB.open('ai_img_history',2);
    req.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'}); if(!db.objectStoreNames.contains('preferences')) db.createObjectStore('preferences',{keyPath:'key'}); };
    req.onsuccess=e=>{ idb=e.target.result; resolve(idb); };
    req.onerror=()=>resolve(null);
  });
}
async function idbAdd(rec){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }
async function idbAll(){ const db=await openIDB(); if(!db)return []; return new Promise(r=>{ const tx=db.transaction('records','readonly'); const req=tx.objectStore('records').getAll(); req.onsuccess=()=>r(req.result||[]); req.onerror=()=>r([]); }); }
async function idbDel(id){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }
async function idbPrefGet(key){const db=await openIDB();if(!db||!db.objectStoreNames.contains('preferences'))return null;return new Promise(r=>{const req=db.transaction('preferences','readonly').objectStore('preferences').get(key);req.onsuccess=()=>r(req.result?.value||null);req.onerror=()=>r(null);});}
async function idbPrefPut(key,value){const db=await openIDB();if(!db||!db.objectStoreNames.contains('preferences'))return;return new Promise(r=>{const tx=db.transaction('preferences','readwrite');tx.objectStore('preferences').put({key,value});tx.oncomplete=()=>r();tx.onerror=()=>r();});}
async function loadDownloadFolderName(){const handle=await idbPrefGet('downloadFolder');downloadFolderName=handle?.name||'';return downloadFolderName;}
async function pruneHistory(){const records=await idbAll();const cutoff=Date.now()-HISTORY_TTL;await Promise.all(records.filter(rec=>(rec.expiresAt||rec.createdAt+HISTORY_TTL)<=Date.now()||rec.createdAt<cutoff).map(rec=>idbDel(rec.id)));}

/* ============ UTILS ============ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fileToBase64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
function base64ToBlob(b64){
  const parts=b64.split(','); const mime=parts[0].match(/:(.*?);/)[1]; const data=atob(parts[1]);
  const arr=new Uint8Array(data.length); for(let i=0;i<data.length;i++)arr[i]=data.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
async function saveDownloadedFile(blob,name){
  const handle=await idbPrefGet('downloadFolder');
  if(handle){
    try{
      let permission=await handle.queryPermission({mode:'readwrite'});
      if(permission!=='granted') permission=await handle.requestPermission({mode:'readwrite'});
      if(permission==='granted'){
        const safeName=String(name).replace(/[\\/:*?"<>|]/g,'_');
        const fileHandle=await handle.getFileHandle(safeName,{create:true});
        const writable=await fileHandle.createWritable(); await writable.write(blob); await writable.close();
        return {folder:handle.name};
      }
    }catch(error){if(error?.name!=='AbortError')toast('固定文件夹暂不可写，已改用浏览器下载','warn');}
  }
  downloadBlob(blob,name); return {folder:''};
}

function bytesToBase64(bytes){let text='';bytes.forEach(byte=>text+=String.fromCharCode(byte));return btoa(text);}
function base64ToBytes(value){const text=atob(value);return Uint8Array.from(text,char=>char.charCodeAt(0));}
async function deriveBackupKey(password,salt,usage){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,[usage]);}
async function exportSettingsBackup(){
  const password=prompt('请设置备份密码（至少8位）。换电脑导入时需要同一个密码：');if(password===null)return;if(password.length<8){toast('备份密码至少需要8位','warn');return;}
  try{const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveBackupKey(password,salt,'encrypt');const plain=new TextEncoder().encode(JSON.stringify({version:1,settings:state.settings,createdAt:new Date().toISOString()}));const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));const payload={format:'zaotutai-settings',version:1,kdf:'PBKDF2-SHA256-210000',cipher:'AES-256-GCM',salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(encrypted)};await saveDownloadedFile(new Blob([JSON.stringify(payload)],{type:'application/json'}),`造图台设置备份_${new Date().toISOString().slice(0,10)}.zts-settings`);toast('加密设置备份已导出，请妥善保存密码','success');}catch(error){toast('设置备份失败：'+error.message,'error');}
}
async function importSettingsBackup(){
  const input=document.createElement('input');input.type='file';input.accept='.zts-settings,application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;const password=prompt('请输入该设置备份的密码：');if(password===null)return;
    try{const payload=JSON.parse(await file.text());if(payload.format!=='zaotutai-settings'||payload.version!==1)throw new Error('不是有效的造图台设置备份');const salt=base64ToBytes(payload.salt),iv=base64ToBytes(payload.iv),encrypted=base64ToBytes(payload.data);const key=await deriveBackupKey(password,salt,'decrypt');const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,encrypted);const backup=JSON.parse(new TextDecoder().decode(plain));if(!backup.settings||typeof backup.settings!=='object')throw new Error('备份内容不完整');const allowed=['arkKey','arkTextModel','openaiKey','geminiKey','visionModel','imageModel','openaiImageModel','geminiTextModel','geminiImageModel','imageFallback'];const restored={};allowed.forEach(name=>{if(Object.hasOwn(backup.settings,name))restored[name]=backup.settings[name];});state.settings={...state.settings,...restored};saveSettings();providerHealth={};closeModal();updateApiStatus();renderMain();toast('设置已恢复，请重新检测模型连接','success');}catch(error){toast(error?.name==='OperationError'?'密码错误或备份文件已损坏':'导入失败：'+error.message,'error');}
  };input.click();
}
async function imageSourceBlob(src){if(String(src).startsWith('data:'))return base64ToBlob(src);const response=await fetch(src);if(!response.ok)throw new Error('图片下载地址已失效');return response.blob();}
async function cacheImageSource(src){if(String(src).startsWith('data:'))return src;try{const blob=await imageSourceBlob(src);return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});}catch(error){return src;}}

function newProject(){
  if(state.projects.length>=MAX_PROJECTS){ toast('最多'+MAX_PROJECTS+'个项目同时运行','warn'); return; }
  const p={id:uid(),name:'商品项目 '+String(state.projects.length+1).padStart(2,'0'),image:'',platform:'taobao',suiteType:'square',direction:'standard',userNote:'',textProvider:state.settings.geminiKey?'gemini':state.settings.arkKey?'doubao':'gemini',imageProvider:state.settings.geminiKey?'gemini':state.settings.arkKey?'seedream':state.settings.openaiKey?'openai':'gemini',status:'idle',phase:'等待上传商品图',analysis:null,whiteImage:'',series:[],qcResults:[],createdAt:Date.now()};
  state.projects.push(p); state.currentProject=p.id; appView='project';
  renderProjectList(); renderMain();
}
function selectProject(id){ state.currentProject=id; appView='project'; renderProjectList(); renderMain(); }
function deleteProject(id){
  if(!confirm('删除该项目？')) return;
  state.projects=state.projects.filter(p=>p.id!==id);
  if(state.currentProject===id) state.currentProject=state.projects[0]?.id||null;
  renderProjectList(); renderMain();
}
function getCurrentProject(){ return state.projects.find(p=>p.id===state.currentProject); }
function ensureToolJob(tool){
  let job=state.toolJobs.find(item=>item.id===state.currentToolJob);
  if(job&&job.toolId===tool.id){job.session=toolSession;return job;}
  const product=String(toolSession.sourceNames?.[0]||'未命名产品').replace(/\.[^.]+$/,'').trim().slice(0,18)||'未命名产品';
  const operation={'cutout':'抠图','product-shot':'作图','white-image':'白底图','background-swap':'换背景','subject-replace':'换主体','product-retouch':'精修'}[tool.id]||tool.name;
  const sequence=state.toolJobs.filter(item=>item.product===product&&item.operation===operation).length+1;
  job={id:uid(),toolId:tool.id,product,operation,name:`${product}-${operation}-${String(sequence).padStart(2,'0')}`,icon:tool.icon,status:'idle',phase:'素材已上传，待生成提示词',createdAt:Date.now(),session:toolSession};
  state.toolJobs.unshift(job); state.currentToolJob=job.id; return job;
}
function updateToolJob(tool,status,phase){const job=ensureToolJob(tool);job.status=status;job.phase=phase;job.session=toolSession;renderProjectList();return job;}
function selectToolJob(id){const job=state.toolJobs.find(item=>item.id===id);if(!job)return;const tool=TOOLS.find(item=>item.id===job.toolId);if(!tool)return;state.currentToolJob=id;activeTool=tool.id;activeCategory=tool.cat;expandedCategory=tool.cat;toolSession=job.session;appView='tool';renderProjectList();renderMain();}
function deleteToolJob(id){if(!confirm('删除该生成任务？'))return;state.toolJobs=state.toolJobs.filter(item=>item.id!==id);if(state.currentToolJob===id)state.currentToolJob=null;renderProjectList();renderMain();}

function renderProjectList(){
  const el=document.getElementById('project-list');
  const counter=document.getElementById('project-counter');
  const addBtn=document.getElementById('new-project-btn');
  const catalogBtn=document.getElementById('catalog-btn');
  if(catalogBtn) catalogBtn.classList.toggle('active',appView==='catalog'||appView==='tool');
  renderCategoryNav();
  const totalJobs=state.projects.length+state.toolJobs.length;
  if(counter) counter.textContent=totalJobs+'/'+MAX_PROJECTS;
  if(addBtn) addBtn.disabled=state.projects.length>=MAX_PROJECTS;
  if(totalJobs===0){ el.innerHTML='<div class="empty" style="padding:20px 10px">上传素材后会自动创建生成任务</div>'; return; }
  const suiteHtml=state.projects.map(p=>{
    const doneCount=p.series.filter(s=>s.image).length;
    const totalCount=p.series.length;
    const stClass=p.status==='running'?'running':p.status==='done'?'done':p.status==='error'?'error':'idle';
    const stText=p.status==='running'?'生成中':p.status==='done'?'已完成':p.status==='error'?'部分失败':'待开始';
    return `<div class="project-item ${p.id===state.currentProject?'active':''}" onclick="selectProject('${p.id}')">
      ${p.image?`<img class="project-thumb" src="${p.image}">`:`<div class="project-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--light)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
      <div class="project-info">
        <div class="project-name">${esc(p.name)}</div>
        <div class="project-status"><span class="status-dot ${stClass}"></span>${stText} ${totalCount>0?doneCount+'/'+totalCount:''}</div>
      </div>
      <button class="project-delete" title="删除项目" onclick="event.stopPropagation();deleteProject('${p.id}')">×</button>
    </div>`;
  }).join('');
  const toolHtml=state.toolJobs.map(job=>{
    const preview=job.session?.results?.[0]||Object.values(job.session?.roleFiles||{}).flat()[0]||job.session?.files?.[0]||'';
    const stClass=job.status==='running'?'running':job.status==='done'?'done':job.status==='error'?'error':'idle';
    const stText=job.status==='running'?'生成中':job.status==='done'?'已完成':job.status==='error'?'生成失败':'待生成';
    return `<div class="project-item ${job.id===state.currentToolJob&&appView==='tool'?'active':''}" onclick="selectToolJob('${job.id}')">${preview?`<img class="project-thumb" src="${preview}">`:`<div class="project-thumb" style="display:flex;align-items:center;justify-content:center">${job.icon}</div>`}<div class="project-info"><div class="project-name">${esc(job.name)}</div><div class="project-status"><span class="status-dot ${stClass}"></span>${stText} · ${esc(job.phase||'')}</div></div><button class="project-delete" title="删除任务" onclick="event.stopPropagation();deleteToolJob('${job.id}')">×</button></div>`;
  }).join('');
  el.innerHTML=toolHtml+suiteHtml;
}

function renderCategoryNav(){
  const el=document.getElementById('category-list'); if(!el) return;
  el.innerHTML=TOOL_CATEGORIES.map(cat=>{
    const tools=TOOLS.filter(tool=>tool.cat===cat.id);
    const count=tools.length;
    const active=(appView==='catalog'||appView==='tool')&&activeCategory===cat.id;
    const open=expandedCategory===cat.id;
    return `<div class="category-group ${open?'open':''}"><button class="category-btn ${active?'active':''}" onclick="toggleCategoryDropdown('${cat.id}')" aria-expanded="${open}"><span class="category-icon">${cat.icon}</span><span>${cat.label}</span><span class="category-count">${count}</span><span class="category-chevron">⌄</span></button><div class="category-tools ${open?'open':''}">${tools.map(tool=>`<button class="category-tool ${appView==='tool'&&activeTool===tool.id?'active':''}" onclick="openTool('${tool.id}')" title="${esc(tool.name)}"><span class="category-tool-dot"></span><span>${esc(tool.name)}</span></button>`).join('')}</div></div>`;
  }).join('');
}

function toggleCategoryDropdown(id){
  expandedCategory=expandedCategory===id?'':id;
  setCategory(id,true);
}

function syncCategoryNav(){
  renderCategoryNav();
  document.querySelectorAll('.quick-category').forEach(button=>button.classList.toggle('active',button.dataset.category===activeCategory));
}
function scrollToCategory(id,behavior){
  const target=document.getElementById('category-'+id); if(!target) return;
  target.scrollIntoView({behavior:behavior||'smooth',block:'start'});
}
function openCatalog(toTop){
  appView='catalog'; activeTool=''; toolSession=makeToolSession(); renderProjectList(); renderMain(); toggleSidebar(false);
  requestAnimationFrame(()=>{ if(toTop===false) scrollToCategory(activeCategory,'auto'); else document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}); });
}
function setCategory(id,keepSidebar){
  activeCategory=id; activeTool=''; toolSession=makeToolSession();
  if(!keepSidebar) expandedCategory=id;
  const needsRender=appView!=='catalog'; appView='catalog';
  if(needsRender) renderMain(); else syncCategoryNav();
  renderProjectList(); if(!keepSidebar) toggleSidebar(false); requestAnimationFrame(()=>scrollToCategory(id,'smooth'));
}
function openTool(id){
  const tool=TOOLS.find(item=>item.id===id); if(!tool) return;
  activeCategory=tool.cat;
  expandedCategory=tool.cat;
  if(tool.action==='project'){
    if(state.currentProject){ appView='project'; renderProjectList(); renderMain(); }
    else newProject();
    toggleSidebar(false);
    return;
  }
  activeTool=id; appView='tool'; state.currentToolJob=null; toolSession=makeToolSession(tool); renderProjectList(); renderMain(); toggleSidebar(false);
}

function renderCatalog(){
  document.getElementById('page-title').textContent='AI 创作工具中心';
  const el=document.getElementById('content');
  el.innerHTML=`
    <section class="catalog-hero"><h2>从一张素材，开始完整创作</h2><p>商品图、视频策划、穿戴展示、图片处理与智能文案集中在同一个工作台。选择功能，上传素材并直接生成。</p></section>
    <div class="catalog-quick-list" aria-label="快速跳转">${TOOL_CATEGORIES.map(cat=>`<button class="quick-category ${cat.id===activeCategory?'active':''}" data-category="${cat.id}" onclick="setCategory('${cat.id}')"><span class="quick-icon">${cat.icon}</span><span>${cat.label}</span><span class="quick-count">${TOOLS.filter(tool=>tool.cat===cat.id).length}</span></button>`).join('')}</div>
    ${TOOL_CATEGORIES.map(cat=>{
      const tools=TOOLS.filter(tool=>tool.cat===cat.id);
      return `<section class="catalog-section" id="category-${cat.id}" data-category="${cat.id}"><div class="catalog-section-head"><div><div style="font-size:10px;color:var(--light)">功能分类</div><h2>${cat.icon} ${cat.label}</h2></div><p>${tools.length} 个工具</p></div><div class="tool-grid">${tools.map(tool=>`<article class="tool-card" tabindex="0" role="button" onclick="openTool('${tool.id}')" onkeydown="if(event.key==='Enter')openTool('${tool.id}')"><div class="tool-art"><span>${tool.icon}</span></div><div class="tool-copy"><h3>${esc(tool.name)}</h3><p>${esc(tool.desc)}</p><span class="tool-badge">${tool.restricted?'授权素材限定':tool.badge||(tool.mode==='text'?'AI策划':'AI图片处理')}</span></div></article>`).join('')}</div></section>`;
    }).join('')}`;
  requestAnimationFrame(setupCategoryObserver);
}

function setupCategoryObserver(){
  if(categoryObserver) categoryObserver.disconnect();
  const root=document.querySelector('.main');
  categoryObserver=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(!visible.length) return;
    const id=visible[0].target.dataset.category;
    if(id&&id!==activeCategory){ activeCategory=id; syncCategoryNav(); }
  },{root,rootMargin:'-18% 0px -70% 0px',threshold:0});
  document.querySelectorAll('.catalog-section').forEach(section=>categoryObserver.observe(section));
}

function desiredOutputCount(tool){
  if(tool.roleOutput) return Math.max(1,toolSession.roleFiles?.[tool.roleOutput]?.length||0);
  if(tool.batchByInput) return Math.max(1,toolSession.files.length);
  if(tool.referenceFirst) return Math.max(1,toolSession.files.length-1);
  if(tool.adjustableCount) return Math.max(1,Math.min(4,toolSession.requestedCount||1));
  return tool.outputCount||1;
}
function setToolProvider(value){ toolSession.provider=value; toolSession.prompts=[]; toolSession.promptSummary=''; toolSession.results=[]; toolSession.resultMeta=[]; renderToolWorkspace(); }
function setToolTextProvider(value){ toolSession.textProvider=value; toolSession.prompts=[]; toolSession.promptSummary=''; toolSession.results=[]; toolSession.resultMeta=[]; renderToolWorkspace(); }
function setToolAspect(value){ toolSession.aspect=value; toolSession.prompts=[]; toolSession.promptSummary=''; toolSession.results=[]; toolSession.resultMeta=[]; renderToolWorkspace(); }
function setToolNote(value){
  toolSession.note=value;
  if(toolSession.prompts.length){ toolSession.prompts=[]; toolSession.promptSummary=''; toolSession.results=[]; toolSession.resultMeta=[]; document.getElementById('prompt-editor')?.remove(); const button=document.getElementById('generate-images-btn'); if(button) button.disabled=true; }
}
function setToolPrompt(index,value){ if(toolSession.prompts[index]) toolSession.prompts[index].prompt=value; }
function toolFiles(tool){
  return tool?.roleUploads?.length?tool.roleUploads.flatMap(role=>toolSession.roleFiles?.[role.id]||[]):toolSession.files;
}
function roleUploadHtml(tool,fileLimit){
  if(!tool.roleUploads?.length) return '';
  return `<div class="role-upload-grid">${tool.roleUploads.map(role=>{
    const files=toolSession.roleFiles?.[role.id]||[];
    const previews=files.length?`<div style="width:100%"><div class="tool-preview-grid">${files.map((src,i)=>`<div class="tool-preview"><img src="${src}" alt="${esc(role.label)} ${i+1}"><span style="position:absolute;left:6px;top:6px;background:rgba(20,31,24,.7);color:#fff;padding:2px 6px;border-radius:99px;font-size:9px">${i+1}</span><button onclick="event.stopPropagation();removeToolRoleFile('${role.id}',${i})" title="移除">×</button></div>`).join('')}</div>${files.length<role.max?'<div class="upload-hint">点击空白处可继续添加</div>':''}</div>`:`<div><div style="font-size:30px;margin-bottom:8px">${role.id==='product'?'📦':'🖼️'}</div><strong>${esc(role.hint)}</strong><div class="upload-hint">${role.min?'必填':'选填'} · JPG / PNG / WebP · 单张不超过${fileLimit}MB</div></div>`;
    return `<div class="role-upload-card"><div class="role-upload-head"><strong>${esc(role.label)}</strong><span>${files.length}/${role.max}</span></div><div class="tool-upload" onclick="document.getElementById('tool-role-${role.id}').click()">${previews}</div><input id="tool-role-${role.id}" type="file" accept="image/jpeg,image/png,image/webp" ${role.max>1?'multiple':''} style="display:none" onchange="handleToolRoleUpload(event,'${role.id}')"><div class="role-upload-note">${esc(role.hint)}</div></div>`;
  }).join('')}</div><div class="input-rule">${esc(tool.inputHint)}</div>`;
}
function renderToolWorkspace(){
  const tool=TOOLS.find(item=>item.id===activeTool); if(!tool){ openCatalog(); return; }
  document.getElementById('page-title').textContent=tool.name;
  const imageAllowed=tool.mode==='image'||tool.acceptImage;
  const uploadCopy=tool.uploadLabel||(tool.maxFiles>1?`上传${tool.minFiles||0}—${tool.maxFiles}张图片`:'上传一张参考图片');
  const needsCopy=tool.minFiles>0?'必填':'选填';
  const notePlaceholder=tool.mode==='text'?'填写原文/商品信息、目标受众、平台、语气、语言或时长':'描述图片目标、主体、场景、风格、颜色、文字与禁止项';
  const fileLimit=tool.maxFiles>4?2.5:8;
  const allFiles=toolFiles(tool);
  const previews=allFiles.length?`<div style="width:100%"><div class="tool-preview-grid">${allFiles.map((src,i)=>`<div class="tool-preview"><img src="${src}" alt="参考素材 ${i+1}"><span style="position:absolute;left:6px;top:6px;background:rgba(20,31,24,.7);color:#fff;padding:2px 6px;border-radius:99px;font-size:9px">${i+1}</span><button onclick="event.stopPropagation();removeToolFile(${i})" title="移除">×</button></div>`).join('')}</div>${allFiles.length<tool.maxFiles?'<div class="upload-hint">点击空白处可继续添加</div>':''}</div>`:`<div><div style="font-size:34px;margin-bottom:8px">${tool.icon}</div><strong>${uploadCopy}</strong><div class="upload-hint">${needsCopy} · JPG / PNG / WebP · 单张不超过${fileLimit}MB</div></div>`;
  const output=tool.mode==='text'
    ?(toolSession.text?`<div class="tool-text-result">${esc(toolSession.text)}</div><button class="btn btn-sm" style="margin-top:10px" onclick="copyToolText()">复制结果</button>`:`<div class="tool-empty">AI生成的文字会显示在这里</div>`)
    :(toolSession.results.length?`<div class="tool-result-grid">${toolSession.results.map((src,i)=>{const meta=toolSession.resultMeta[i]||{};return `<div class="tool-result"><img src="${src}" alt="生成结果 ${i+1}"><div class="result-actions"><div class="result-meta"><strong>${esc(meta.model||imageProviderLabel(meta.provider)||'图片模型')}</strong>${meta.fallback?`<span class="fallback">已从 ${esc(meta.fallbackFrom||'首选模型')} 自动切换</span>`:'<span>首选模型完成</span>'}</div><button class="btn btn-sm" onclick="downloadToolResult(${i})">下载</button></div></div>`;}).join('')}</div><button class="btn btn-primary" style="margin-top:12px" onclick="downloadToolZip()">下载任务 ZIP</button>`:`<div class="tool-empty">先生成并确认提示词，再生成图片<br>批量任务会按素材逐张返回</div>`);
  const textProvider=`<div class="form-group"><label class="label">文字与素材理解模型</label><select class="input" onchange="setToolTextProvider(this.value)"><option value="gemini" ${toolSession.textProvider==='gemini'?'selected':''}>Gemini（免费额度优先）</option><option value="doubao" ${toolSession.textProvider==='doubao'?'selected':''}>火山方舟（自动分配 DeepSeek / 豆包视觉）</option></select><div class="model-note">纯文字任务使用 DeepSeek；含图片任务自动使用豆包多模态视觉模型</div></div>`;
  const imageProvider=tool.mode==='image'?`<div class="form-group"><label class="label">图片生成模型</label><select class="input" onchange="setToolProvider(this.value)"><option value="gemini" ${toolSession.provider==='gemini'?'selected':''}>Nano Banana 2（免费额度优先）</option><option value="seedream" ${toolSession.provider==='seedream'?'selected':''}>Seedream 5.0</option><option value="openai" ${toolSession.provider==='openai'?'selected':''}>GPT Image 2</option></select><div class="model-note">切换模型后会重新优化提示词</div></div>`:'';
  const promptEditor=tool.mode==='image'?`<div class="workflow-steps"><div class="workflow-step ${toolSession.prompts.length?'ready':''}">① AI生成提示词</div><div class="workflow-step ${toolSession.results.length?'ready':''}">② 确认后生图</div></div>${toolSession.prompts.length?`<div class="prompt-editor" id="prompt-editor"><div class="prompt-editor-head"><strong>图片提示词（可修改）</strong><span class="tag tag-success">${toolSession.prompts.length} 条</span></div><div class="prompt-summary">${esc(toolSession.promptSummary)}</div>${toolSession.prompts.map((item,i)=>`<div class="prompt-item"><label><span>${i+1}. ${esc(item.label)}</span><span>可编辑</span></label><textarea class="input" maxlength="12000" oninput="setToolPrompt(${i},this.value)">${esc(item.prompt)}</textarea></div>`).join('')}</div>`:''}`:'';
  const expected=desiredOutputCount(tool);
  document.getElementById('content').innerHTML=`
    <div class="tool-head"><button class="tool-back" onclick="openCatalog(false)" aria-label="返回">‹</button><div><h2>${esc(tool.name)}</h2><p>${esc(tool.desc)}</p></div></div>
    ${tool.restricted?'<div class="phase-box"><strong>授权素材限定</strong><p>请只处理您拥有或已取得明确授权的素材；不得用于冒充身份、伪造文件或移除他人版权归属。</p></div>':''}
    <div class="tool-layout"><section class="tool-panel"><div class="card-title">任务设置</div>
      ${imageAllowed?(tool.roleUploads?.length?roleUploadHtml(tool,fileLimit):`<div class="tool-upload" onclick="document.getElementById('tool-file-input').click()">${previews}</div><input id="tool-file-input" type="file" accept="image/jpeg,image/png,image/webp" ${tool.maxFiles>1?'multiple':''} style="display:none" onchange="handleToolUpload(event)"><div class="input-rule">${esc(tool.inputHint||`${needsCopy}：最少${tool.minFiles||0}张，最多${tool.maxFiles}张；当前预计输出${expected}张`)}</div>`):''}
      <div class="form-group" style="margin-top:14px"><label class="label">具体要求</label><textarea class="input" rows="6" maxlength="6000" placeholder="${notePlaceholder}" oninput="setToolNote(this.value)">${esc(toolSession.note)}</textarea></div>
      ${textProvider}${imageProvider}
      ${tool.mode==='image'?`<div class="form-group"><label class="label">输出比例</label><select class="input" onchange="setToolAspect(this.value)"><option value="square" ${toolSession.aspect==='square'?'selected':''}>1:1 正方形</option><option value="vertical" ${toolSession.aspect==='vertical'?'selected':''}>2:3 竖版</option><option value="wide" ${toolSession.aspect==='wide'?'selected':''}>16:9 横版</option></select></div>`:''}
      ${tool.adjustableCount?`<div class="form-group"><label class="label">生成数量</label><select class="input" onchange="toolSession.requestedCount=Number(this.value);toolSession.prompts=[];renderToolWorkspace()">${[1,2,3,4].map(n=>`<option value="${n}" ${toolSession.requestedCount===n?'selected':''}>${n} 张</option>`).join('')}</select></div>`:''}
      ${promptEditor}
      ${tool.mode==='image'?`<div class="tool-actions"><button class="btn tool-run" ${toolSession.running?'disabled':''} onclick="generateToolPrompts()">${toolSession.running?'处理中…':'① AI生成提示词'}</button><button class="btn btn-primary tool-run" id="generate-images-btn" ${toolSession.running||!toolSession.prompts.length?'disabled':''} onclick="generateToolImages()">${toolSession.running?'处理中…':'② 确认并生图'}</button></div>`:`<button class="btn btn-primary tool-run" ${toolSession.running?'disabled':''} onclick="runTextTool()">${toolSession.running?'正在处理…':'生成文字'}</button>`}
    </section><section class="tool-panel"><div class="card-title">输出结果 ${toolSession.results.length||toolSession.text?'<span class="tag tag-success">已生成</span>':''}</div>${output}</section></div>`;
}

function projectHasWhiteOutput(p){ return p.suiteType!=='vertical'; }
function projectTextProvider(p){ return p.textProvider||(state.settings.geminiKey?'gemini':state.settings.arkKey?'doubao':'gemini'); }
function projectImageProvider(p){ return p.imageProvider||(state.settings.geminiKey?'gemini':state.settings.arkKey?'seedream':state.settings.openaiKey?'openai':'gemini'); }
function hasProjectTextKey(p){ return projectTextProvider(p)==='gemini'?Boolean(state.settings.geminiKey):Boolean(state.settings.arkKey); }
function hasAnyImageKey(){ return Boolean(state.settings.geminiKey||state.settings.openaiKey||state.settings.arkKey); }
function hasImageProviderKey(provider){ return provider==='gemini'?Boolean(state.settings.geminiKey):provider==='openai'?Boolean(state.settings.openaiKey):Boolean(state.settings.arkKey); }
function hasProjectImageKey(p){ return hasImageProviderKey(projectImageProvider(p))||(state.settings.imageFallback!==false&&hasAnyImageKey()); }
function setProjectTextProvider(value){ const p=getCurrentProject();if(!projectEditable(p))return;p.textProvider=value;resetProjectPlan(p);renderMain();renderProjectList(); }
function setProjectImageProvider(value){ const p=getCurrentProject();if(!projectEditable(p))return;p.imageProvider=value;resetProjectPlan(p);renderMain();renderProjectList(); }
function updateProjectWhitePrompt(value){
  const p=getCurrentProject(); if(!p?.analysis) return;
  p.analysis.white_prompt=value;
  if(projectHasWhiteOutput(p)&&p.series[0]) p.series[0].prompt=value;
}
function updateProjectPrompt(index,value){ const p=getCurrentProject(); if(p?.series[index]) p.series[index].prompt=value; }
function renderProjectPromptPlan(p){
  if(!p.analysis) return '';
  const offset=projectHasWhiteOutput(p)?1:0;

async function handleUpload(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>8*1024*1024){ toast('图片超过8MB限制','error'); return; }
  const validTypes=['image/jpeg','image/png','image/webp'];
  if(!validTypes.includes(file.type)){ toast('图片格式错误，支持JPG/PNG/WebP','error'); return; }
  const p=getCurrentProject(); if(!p) return;
  try{
    const b64=await fileToBase64(file);
    p.image=b64; p.name=file.name.replace(/\.[^.]+$/,'').slice(0,20)||p.name;
    p.analysis=null; p.whiteImage=''; p.series=[]; p.qcResults=[]; p.status='idle'; p.phase='商品图已上传，等待选择生成方向';
    renderProjectList(); renderMain();
    toast('图片上传成功','success');
  }catch(err){ toast('图片读取失败','error'); }
}

/* ============ API CALLS ============ */
async function apiCall(path,data,extraHeaders){
  const headers={'Content-Type':'application/json','X-Request-Id':uid(),...(extraHeaders||{})};
  if(state.settings.arkKey) headers['X-Ark-Key']=state.settings.arkKey;
  if(state.settings.openaiKey) headers['X-OpenAI-Key']=state.settings.openaiKey;
  if(state.settings.geminiKey) headers['X-Gemini-Key']=state.settings.geminiKey;
  const resp=await fetch(getApiBase()+path,{method:'POST',headers,body:JSON.stringify(data)});
  const raw=await resp.text();
  let json={};
  try{ json=raw?JSON.parse(raw):{}; }catch(e){ throw new Error('服务器返回格式异常（HTTP '+resp.status+'）'); }
  if(!resp.ok){
    const detail=[json.error||'请求失败（HTTP '+resp.status+'）',json.code&&`错误码 ${json.code}`,json.requestId&&`追踪号 ${json.requestId}`].filter(Boolean).join(' · ');
    const error=new Error(detail); error.code=json.code||''; error.requestId=json.requestId||''; error.status=resp.status; throw error;
  }
  return json;
}

/* ============ CREATIVE TOOLS ============ */
async function handleToolUpload(event){
  const tool=TOOLS.find(item=>item.id===activeTool); if(!tool) return;
  const incoming=Array.from(event.target.files||[]);
  const room=Math.max(0,tool.maxFiles-toolSession.files.length);
  const selected=incoming.slice(0,room);
  const valid=[];
  const fileLimit=(tool.maxFiles>4?2.5:8)*1024*1024;
  for(const file of selected){
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){ toast(file.name+' 格式不支持','error'); continue; }
    if(file.size>fileLimit){ toast(file.name+' 体积过大','error'); continue; }
    try{ valid.push(await fileToBase64(file)); }catch(error){ toast(file.name+' 读取失败','error'); }
  }
  toolSession.files=toolSession.files.concat(valid).slice(0,tool.maxFiles);
  toolSession.sourceNames=toolSession.sourceNames.concat(selected.slice(0,valid.length).map(file=>file.name)).slice(0,tool.maxFiles);
  toolSession.results=[]; toolSession.resultMeta=[]; toolSession.text=''; toolSession.prompts=[]; toolSession.promptSummary=''; event.target.value='';
  if(valid.length) updateToolJob(tool,'idle','素材已上传，待生成提示词'); renderToolWorkspace();
}
async function handleToolRoleUpload(event,roleId){
  const tool=TOOLS.find(item=>item.id===activeTool); const role=tool?.roleUploads?.find(item=>item.id===roleId); if(!tool||!role) return;
  const current=toolSession.roleFiles?.[roleId]||[];
  const incoming=Array.from(event.target.files||[]).slice(0,Math.max(0,role.max-current.length));
  const valid=[]; const fileLimit=(tool.maxFiles>4?2.5:8)*1024*1024;
  for(const file of incoming){
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){ toast(file.name+' 格式不支持','error'); continue; }
    if(file.size>fileLimit){ toast(file.name+' 体积过大','error'); continue; }
    try{ valid.push(await fileToBase64(file)); }catch(error){ toast(file.name+' 读取失败','error'); }
  }
  toolSession.roleFiles[roleId]=current.concat(valid).slice(0,role.max);
  toolSession.sourceNames=toolSession.sourceNames.concat(incoming.slice(0,valid.length).map(file=>file.name));
  toolSession.results=[]; toolSession.resultMeta=[]; toolSession.text=''; toolSession.prompts=[]; toolSession.promptSummary=''; event.target.value='';
  if(valid.length) updateToolJob(tool,'idle','素材已上传，待生成提示词'); renderToolWorkspace();
}

function removeToolRoleFile(roleId,index){

function generationUnits(tool){
  if(tool.roleOutput){
    const targets=toolSession.roleFiles?.[tool.roleOutput]||[];
    return targets.map(target=>tool.roleUploads.flatMap(role=>role.id===tool.roleOutput?[target]:(toolSession.roleFiles?.[role.id]||[])));
  }
  if(tool.roleUploads?.length) return Array.from({length:desiredOutputCount(tool)},()=>toolFiles(tool));
  if(tool.batchByInput) return toolSession.files.map(image=>[image]);
  if(tool.referenceFirst) return toolSession.files.slice(1).map(image=>[toolSession.files[0],image]);
  return Array.from({length:desiredOutputCount(tool)},()=>toolSession.files.slice());
}
async function directSeedreamImage(images,prompt,aspect){
  const model=cleanModelId(state.settings.imageModel)||'doubao-seedream-5-0-260128';
  const ratio=aspect==='vertical'?'2:3竖版':aspect==='horizontal'?'16:9横版':'1:1正方形';
  const body={model,prompt:`${prompt}\n输出比例：${ratio}。`,size:'2K',response_format:'url',watermark:false};
  if(images.length===1) body.image=images[0];
  else if(images.length>1) body.image=images;
  const resp=await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations',{
    method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.settings.arkKey},body:JSON.stringify(body)
  });
  const raw=await resp.text(); let data={};
  try{data=raw?JSON.parse(raw):{};}catch(e){}
  if(!resp.ok) throw new Error(data?.error?.message||data?.message||`Seedream浏览器直连失败（HTTP ${resp.status}）`);
  const item=data?.data?.[0]||{};
  const image=item.url||(item.b64_json?`data:image/jpeg;base64,${item.b64_json}`:'');
  if(!image) throw new Error('Seedream已响应但未返回图片，请检查图片模型 ID 与生图权限');
  return {image,provider:'seedream',model,fallback:false,direct:true};
}
async function generateToolImages(){

  try{
    for(let i=0;i<toolSession.prompts.length;i++){
      updateToolJob(tool,'running',`正在生成 ${i+1}/${toolSession.prompts.length}`);
      const refs=units[i]||units[units.length-1]||[];

        }
      }else data=await apiCall('/api/tool-image',{toolId:tool.id,prompt:toolSession.prompts[i].prompt,imageBase64s:refs,aspect:toolSession.aspect,provider:toolSession.provider,allowFallback:state.settings.imageFallback!==false,imageModel:state.settings.imageModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined,geminiImageModel:state.settings.geminiImageModel||undefined});
      if(data.image){
        toolSession.results.push(data.image);
        toolSession.resultMeta.push({provider:data.provider,model:data.model,fallback:Boolean(data.fallback),fallbackFrom:data.fallbackFrom||'',fallbackCode:data.fallbackCode||''});
        if(data.fallback) toast(`第${i+1}张已从${data.fallbackFrom||imageProviderLabel(toolSession.provider)}自动切换到${imageProviderLabel(data.provider)}`,'warn');
      }
      renderToolWorkspace();
    }
    const job=updateToolJob(tool,'done',`已完成 ${toolSession.results.length}/${toolSession.prompts.length}`);
    const cachedImages=await Promise.all(toolSession.results.map(cacheImageSource));
    await idbAdd({id:'tool-'+job.id,kind:'tool',name:job.name,toolId:tool.id,platform:'图片工具',series:cachedImages.map((image,index)=>({label:toolSession.prompts[index]?.label||`结果 ${index+1}`,image,model:toolSession.resultMeta[index]?.model||'',provider:toolSession.resultMeta[index]?.provider||''})),createdAt:Date.now(),expiresAt:Date.now()+HISTORY_TTL});
    toast('图片生成完成，已缓存到历史记录 24 小时','success');
  }catch(error){ updateToolJob(tool,'error','生成失败，可进入任务重试'); toast('图片生成失败：'+error.message,'error'); }
  finally{ toolSession.running=false; renderToolWorkspace(); renderProjectList(); }
}

const OUTPUT_LABELS={square:['白底商品主图','核心卖点场景','材质做工细节','尺寸使用感知','转化留白构图'],vertical:['首屏卖点概览','核心结构功能','材质工艺证明','尺寸适配说明','使用场景收尾'],full:['白底商品主图','核心卖点场景','材质做工细节','尺寸使用感知','转化留白构图','首屏卖点概览','核心结构功能','材质工艺证明','尺寸适配说明','使用场景收尾']};
function modelOptions(p){ return {provider:projectImageProvider(p),allowFallback:state.settings.imageFallback!==false,imageModel:state.settings.imageModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined,geminiImageModel:state.settings.geminiImageModel||undefined}; }
function outputAspect(p,index){ return p.suiteType==='vertical'||(p.suiteType==='full'&&index>=5)?'vertical':'square'; }

async function generateOneTask(p,task,index){
  const item=p.series[index];
  item.prompt=task.prompt; item.status='running';
  p.phase='正在生成第 '+(index+1)+' 张：'+item.label;
  renderMain(); renderProjectList();
  try{
    const aspect=outputAspect(p,index);
    const imgResp=await apiCall('/api/series-image',{prompt:task.prompt,whiteImageBase64:p.whiteImage,aspect,...modelOptions(p)});
    item.image=imgResp.image; item.model=imgResp.model; item.provider=imgResp.provider; item.fallback=Boolean(imgResp.fallback); item.fallbackFrom=imgResp.fallbackFrom||''; item.status='done';
    if(imgResp.fallback) toast(`图${index+1}已从${imgResp.fallbackFrom||imageProviderLabel(projectImageProvider(p))}自动切换到${imageProviderLabel(imgResp.provider)}`,'warn');
    p.phase='正在质检第 '+(index+1)+' 张：'+item.label;
    renderMain();
    try{
      let qc=await apiCall('/api/qc',{whiteImageBase64:p.whiteImage,generatedImageBase64:item.image,taskLabel:item.label,platform:p.platform,textProvider:projectTextProvider(p),visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
      p.qcResults[index]=qc;
      if(!qc.pass){
        toast('图'+(index+1)+'未通过质检，正在自动修正重做','warn');
        p.phase='第 '+(index+1)+' 张质检未通过，正在自动重做'; renderMain();
        const correction=(qc.correction||qc.summary||'恢复商品真实外观并移除错误元素').slice(0,300);
        const redoResp=await apiCall('/api/series-image',{prompt:task.prompt+'\n质检修正要求：'+correction,whiteImageBase64:p.whiteImage,aspect,...modelOptions(p)});
        item.image=redoResp.image; item.model=redoResp.model+'-redo'; item.provider=redoResp.provider; item.fallback=Boolean(redoResp.fallback); item.fallbackFrom=redoResp.fallbackFrom||'';
        if(redoResp.fallback) toast(`图${index+1}重做时已自动切换到${imageProviderLabel(redoResp.provider)}`,'warn');
        const qc2=await apiCall('/api/qc',{whiteImageBase64:p.whiteImage,generatedImageBase64:item.image,taskLabel:item.label,platform:p.platform,textProvider:projectTextProvider(p),visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
        qc2.redone=true; p.qcResults[index]=qc2;
      }
    }catch(qcError){
      p.qcResults[index]={pass:false,score:0,summary:'自动质检暂时未完成，建议人工复核',correction:''};
      toast('图'+(index+1)+'质检暂未完成','warn');
    }
  }catch(error){
    item.status='error';
    toast('图'+(index+1)+'生成失败：'+error.message,'error');
  }
  renderMain(); renderProjectList();
}

async function runPool(tasks,limit){
  let cursor=0;
  async function worker(){ while(cursor<tasks.length){ const task=tasks[cursor++]; await task(); } }
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},worker));
}

async function planProjectPrompts(){
  const p=getCurrentProject(); if(!p||!p.image) return;
  if(!hasProjectTextKey(p)){ toast('请先配置所选文字模型的 API Key','warn'); showSettings(); return; }
  const labels=OUTPUT_LABELS[p.suiteType];
  p.series=labels.map((label,index)=>({id:index,label,prompt:'',image:'',status:'pending',model:'',provider:'',fallback:false,fallbackFrom:''}));
  p.qcResults=[]; p.status='running'; p.phase='正在识别商品并规划整套提示词'; p.whiteImage=''; p.analysis=null;
  renderMain(); renderProjectList();
  try{
    toast('正在识别商品并制定平台提示词...','');
    const analysis=await apiCall('/api/analyze',{imageBase64:p.image,platform:p.platform,suiteType:p.suiteType,direction:p.direction,userNote:p.userNote,textProvider:projectTextProvider(p),imageProvider:projectImageProvider(p),visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined});
    p.analysis=analysis;
    const hasWhiteOutput=p.suiteType!=='vertical';
    const plans=analysis.series||[];
    const offset=hasWhiteOutput?1:0;
    if(hasWhiteOutput) p.series[0].prompt=analysis.white_prompt;
    plans.forEach((task,i)=>{ if(p.series[i+offset]) p.series[i+offset].prompt=task.prompt; });
    if(p.series.some(item=>!item.prompt)) throw new Error('提示词数量不完整，请重新规划');
    p.status='idle'; p.phase='整套提示词已生成，等待检查与确认';
    renderMain(); renderProjectList(); toast(analysis.fallback?`原文字模型未通过，已自动改用${analysis.provider==='gemini'?'Gemini':'豆包'}完成提示词`:'提示词已生成，请逐条检查后再生图',analysis.fallback?'warn':'success');
  }catch(error){
    p.status='error'; p.phase='提示词规划失败'; p.analysis=null; p.series=[]; renderMain(); renderProjectList();
    toast('提示词生成失败：'+error.message,'error');
  }
}

async function generateProjectImages(){
  const p=getCurrentProject(); if(!p||!p.image||!p.analysis) return;
  if(!hasProjectImageKey(p)){ toast('请先配置所选图片模型的 API Key','warn'); showSettings(); return; }
  if(!p.analysis.white_prompt?.trim()||p.series.some(item=>!item.prompt?.trim())){ toast('请补全所有图片提示词','warn'); return; }
  const labels=OUTPUT_LABELS[p.suiteType];
  p.series.forEach(item=>{ item.image='';item.status='pending';item.model='';item.provider='';item.fallback=false;item.fallbackFrom=''; });
  p.qcResults=[]; p.status='running'; p.phase='正在根据已确认提示词制作白底基准图'; p.whiteImage='';
  renderMain(); renderProjectList();
  try{
    const whiteResp=await apiCall('/api/white-image',{prompt:p.analysis.white_prompt,imageBase64:p.image,...modelOptions(p)});
    p.whiteImage=whiteResp.image;
    if(whiteResp.fallback) toast(`白底基准图已从${whiteResp.fallbackFrom||imageProviderLabel(projectImageProvider(p))}自动切换到${imageProviderLabel(whiteResp.provider)}`,'warn');
    const hasWhiteOutput=projectHasWhiteOutput(p);
    if(hasWhiteOutput){
      p.series[0]={...p.series[0],prompt:p.analysis.white_prompt,image:whiteResp.image,status:'done',model:whiteResp.model||projectImageProvider(p),provider:whiteResp.provider||projectImageProvider(p),fallback:Boolean(whiteResp.fallback),fallbackFrom:whiteResp.fallbackFrom||''};
      p.qcResults[0]={pass:true,score:100,summary:'白底基准图',correction:''};
    }
    renderMain(); renderProjectList();
    const offset=hasWhiteOutput?1:0;
    const jobs=p.series.slice(offset).map((item,i)=>()=>generateOneTask(p,{label:labels[i+offset],prompt:item.prompt},i+offset));
    await runPool(jobs,2);

    const doneCount=p.series.filter(item=>item.image).length;
    p.status=doneCount===labels.length?'done':'error';
    p.phase=doneCount===labels.length?'整套图片已生成并完成质检':'部分图片未完成，可单张重做';
    renderMain(); renderProjectList();
    if(doneCount){
      await idbAdd({id:p.id,name:p.name,platform:p.platform,suiteType:p.suiteType,direction:p.direction,whiteImage:p.whiteImage,series:p.series.map(item=>({label:item.label,image:item.image,model:item.model,provider:item.provider,fallback:item.fallback,fallbackFrom:item.fallbackFrom,prompt:item.prompt})),qcResults:p.qcResults,createdAt:Date.now()});
      toast((doneCount===labels.length?'整套生成完成！':'生成完成，部分图片需要重做。')+' 已保存到历史记录',doneCount===labels.length?'success':'warn');
    }
  }catch(error){
    p.status='error'; p.phase='任务中断'; renderMain(); renderProjectList();
    toast('生成失败：'+error.message,'error');
  }
}

async function regenSingle(idx){
