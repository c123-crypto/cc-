<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>AI商品图片工作台</title>
<style>
:root{
  --bg:#f4f2eb;--card:#fffefa;--border:#dedfd7;--text:#1d2922;--sub:#68736c;--light:#929a94;
  --primary:#176b45;--primary-bg:#e9f3ed;--success:#168451;--success-bg:#e7f5ed;
  --warn:#d97706;--warn-bg:#fef3e6;--danger:#dc2626;--danger-bg:#fce8e8;
  --taobao:#ff6a00;--pdd:#e02e24;--a1688:#ff7a00;
  --radius:16px;--shadow:0 8px 28px rgba(29,50,38,.055);--shadow-lg:0 18px 50px rgba(22,44,31,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cfd3da;border-radius:3px}

.app{display:flex;height:100vh;overflow:hidden}

/* === Sidebar === */
.sidebar{width:250px;flex-shrink:0;background:#143f2d;color:#f4f0df;border-right:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:100}
.logo{padding:24px 20px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo svg{flex-shrink:0;color:#efc57f}.logo small{display:block;font-size:9px;font-weight:400;color:#a9c1b3;letter-spacing:.08em}
.project-list{flex:1;padding:10px;overflow-y:auto}
.project-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:all .15s}
.project-item:hover{background:rgba(255,255,255,.08)}
.project-item.active{background:rgba(255,255,255,.13)}
.project-thumb{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(239,197,127,.65);flex-shrink:0;background:#285943}
.project-info{flex:1;min-width:0}
.project-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-status{font-size:10px;color:#a7bdb0}.project-delete{opacity:0;color:#b9cabf;padding:5px;font-size:16px;line-height:1}.project-item:hover .project-delete{opacity:1}.project-delete:hover{color:#fff}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}
.status-dot.idle{background:var(--light)}
.status-dot.running{background:var(--warn);animation:pulse 1.5s infinite}
.status-dot.done{background:var(--success)}
.status-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.12)}
.new-project-btn{width:100%;padding:11px;background:#efc57f;color:#173c2c;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.new-project-btn:hover{background:#f6d89e}
.history-btn{width:100%;padding:9px;margin-top:6px;font-size:12px;color:#b8cbbf;display:flex;align-items:center;justify-content:center;gap:6px}
.history-btn:hover{color:#fff}

/* === Main === */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:rgba(244,242,235,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.topbar .api-status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.topbar .settings-btn{width:36px;height:36px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.topbar .settings-btn:hover{color:var(--primary)}
.engine-pill{font-size:10px;color:#3f6752;border:1px solid #cbd7ce;background:rgba(255,255,255,.65);border-radius:99px;padding:6px 10px}.engine-pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#29a469;margin-right:6px}
.content{padding:30px;max-width:1080px;width:100%;margin:0 auto}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin:4px 0 22px}.hero h2{font-family:Georgia,"Songti SC",serif;font-size:32px;font-weight:500;letter-spacing:-.03em}.hero p{color:var(--sub);font-size:12px;margin-top:7px}.flow-strip{display:flex;gap:6px;flex-wrap:wrap}.flow-strip span{font-size:10px;border:1px solid var(--border);background:rgba(255,255,255,.55);padding:6px 9px;border-radius:99px;color:#5f6c64}

/* === Cards === */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{color:var(--primary)}
.card-title .actions{margin-left:auto;display:flex;gap:8px}

.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.btn:hover{background:#ebedf0}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#105a39}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}

/* === Upload === */
.upload-zone{border:1px dashed #bdc8c0;border-radius:var(--radius);padding:46px 20px;text-align:center;cursor:pointer;transition:all .15s;background:#f8f8f3}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-bg)}
.upload-zone.has-image{padding:0;border-style:solid;border-color:var(--border)}
.upload-zone img{max-width:100%;max-height:300px;border-radius:var(--radius);display:block;margin:0 auto}
.upload-icon{color:var(--light);margin-bottom:8px}
.upload-text{font-size:14px;color:var(--sub)}
.upload-hint{font-size:12px;color:var(--light);margin-top:4px}

/* === Platform & Suite === */
.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.platform-opt{padding:16px 12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500}
.platform-opt:hover{border-color:var(--primary)}
.platform-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.platform-opt .p-icon{font-size:24px;margin-bottom:6px}
.platform-opt .p-desc{font-size:11px;color:var(--light);margin-top:4px;font-weight:400}

.suite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.suite-opt{padding:12px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px}
.suite-opt:hover{border-color:var(--primary)}
.suite-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.suite-opt .s-count{font-size:11px;color:var(--light);margin-top:2px}

.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.direction-opt{padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s}
.direction-opt:hover{border-color:var(--primary)}
.direction-opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}

.label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.input,textarea.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px}
textarea.input{resize:vertical;min-height:60px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}

/* === Generation Progress === */
.gen-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gen-item{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 5px 20px rgba(30,48,37,.04)}
.gen-item-img{width:100%;aspect-ratio:1;background:var(--bg);position:relative;display:flex;align-items:center;justify-content:center}
.gen-item-img img{width:100%;height:100%;object-fit:cover}
.gen-item-img.vertical img{object-fit:contain}
.gen-item-placeholder{color:var(--light);font-size:12px;text-align:center;padding:20px}
.gen-item-info{padding:8px 10px}
.gen-item-label{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen-item-meta{font-size:10px;color:var(--light);display:flex;align-items:center;gap:4px;margin-top:2px}
.gen-item-actions{display:flex;gap:4px;margin-top:6px}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-success{background:var(--success-bg);color:var(--success)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-info{background:var(--primary-bg);color:var(--primary)}
.tag-default{background:#f0f1f3;color:var(--sub)}

.progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}.phase-box{background:#edf5ef;border:1px solid #cee1d4;border-radius:12px;padding:13px 14px;margin-bottom:14px}.phase-box strong{display:block;font-size:12px}.phase-box p{font-size:10px;color:#718078;margin-top:3px}

/* === Modal === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadow-lg);margin:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.form-group{margin-bottom:14px}

/* === Toast === */
.toast-container{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;border-left:4px solid var(--primary);animation:slideIn .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* === History === */
.history-item{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.history-item:hover{border-color:var(--primary)}
.history-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0}
.history-info{flex:1}
.history-title{font-size:13px;font-weight:500}
.history-meta{font-size:11px;color:var(--light);margin-top:2px}

.empty{text-align:center;padding:40px 20px;color:var(--light);font-size:13px}
.section-desc{font-size:12px;color:var(--sub);margin-bottom:14px}

/* === Mobile === */
.menu-btn{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg);align-items:center;justify-content:center}
.mobile-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .mobile-backdrop.show{display:block}
  .menu-btn{display:flex}
  .content{padding:14px}
  .platform-grid,.suite-grid{grid-template-columns:1fr 1fr}
  .direction-grid{grid-template-columns:1fr}
  .gen-list{grid-template-columns:1fr 1fr}
  .topbar h1{font-size:14px}
}
@media(max-width:480px){
  .platform-grid,.suite-grid,.gen-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      <div>造图台<small>AI PRODUCT STUDIO</small></div>
    </div>
    <div class="project-list" id="project-list"></div>
    <div class="sidebar-footer">
      <button class="new-project-btn" onclick="newProject()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建项目
      </button>
      <button class="history-btn" onclick="showHistory()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        历史记录
      </button>
    </div>
  </aside>
  <div class="mobile-backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar(true)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title">AI商品图片工作台</h1>
      <div class="spacer"></div>
      <span class="engine-pill">OpenAI优先 · 豆包备用 · 自动质检</span>
      <div class="api-status" id="api-status">未配置API</div>
      <button class="settings-btn" onclick="showSettings()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<script src="/vendor/jszip.min.js"></script>
<script>
/* ============ STATE ============ */
const STORAGE_KEY = 'ai_img_workbench';
const MAX_PROJECTS = 6;
let state = { projects:[], currentProject:null, settings:{arkKey:'',openaiKey:'',visionModel:'',imageModel:'',openaiImageModel:''} };

function loadState(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw){ const s=JSON.parse(raw); state.settings={...state.settings,...(s.settings||{})}; } }catch(e){}
}
function saveSettings(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({settings:state.settings}));
}
function getApiBase(){ return window.location.origin; }

/* ============ IndexedDB ============ */
let idb=null;
function openIDB(){
  return new Promise((resolve)=>{
    if(idb) return resolve(idb);
    const req=indexedDB.open('ai_img_history',1);
    req.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('records')) db.createObjectStore('records',{keyPath:'id'}); };
    req.onsuccess=e=>{ idb=e.target.result; resolve(idb); };
    req.onerror=()=>resolve(null);
  });
}
async function idbAdd(rec){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }
async function idbAll(){ const db=await openIDB(); if(!db)return []; return new Promise(r=>{ const tx=db.transaction('records','readonly'); const req=tx.objectStore('records').getAll(); req.onsuccess=()=>r(req.result||[]); req.onerror=()=>r([]); }); }
async function idbDel(id){ const db=await openIDB(); if(!db)return; return new Promise(r=>{ const tx=db.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete=()=>r(); tx.onerror=()=>r(); }); }

/* ============ TOAST ============ */
function toast(msg,type){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 4000);
}

/* ============ UTILS ============ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fileToBase64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
function base64ToBlob(b64){
  const parts=b64.split(','); const mime=parts[0].match(/:(.*?);/)[1]; const data=atob(parts[1]);
  const arr=new Uint8Array(data.length); for(let i=0;i<data.length;i++)arr[i]=data.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function formatTime(t){ const d=new Date(t); return d.getMonth()+1+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* ============ PROJECTS ============ */
function newProject(){
  if(state.projects.length>=MAX_PROJECTS){ toast('最多'+MAX_PROJECTS+'个项目同时运行','warn'); return; }
  const p={id:uid(),name:'商品项目 '+String(state.projects.length+1).padStart(2,'0'),image:'',platform:'taobao',suiteType:'square',direction:'standard',userNote:'',status:'idle',phase:'等待上传商品图',analysis:null,whiteImage:'',series:[],qcResults:[],createdAt:Date.now()};
  state.projects.push(p); state.currentProject=p.id;
  renderProjectList(); renderMain();
}
function selectProject(id){ state.currentProject=id; renderProjectList(); renderMain(); }
function deleteProject(id){
  if(!confirm('删除该项目？')) return;
  state.projects=state.projects.filter(p=>p.id!==id);
  if(state.currentProject===id) state.currentProject=state.projects[0]?.id||null;
  renderProjectList(); renderMain();
}
function getCurrentProject(){ return state.projects.find(p=>p.id===state.currentProject); }

function renderProjectList(){
  const el=document.getElementById('project-list');
  if(state.projects.length===0){ el.innerHTML='<div class="empty" style="padding:20px 10px">点击下方新建项目</div>'; return; }
  el.innerHTML=state.projects.map(p=>{
    const doneCount=p.series.filter(s=>s.image).length;
    const totalCount=p.series.length;
    const stClass=p.status==='running'?'running':p.status==='done'?'done':p.status==='error'?'error':'idle';
    const stText=p.status==='running'?'生成中':p.status==='done'?'已完成':p.status==='error'?'部分失败':'待开始';
    return `<div class="project-item ${p.id===state.currentProject?'active':''}" onclick="selectProject('${p.id}')">
      ${p.image?`<img class="project-thumb" src="${p.image}">`:`<div class="project-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--light)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
      <div class="project-info">
        <div class="project-name">${esc(p.name)}</div>
        <div class="project-status"><span class="status-dot ${stClass}"></span>${stText} ${totalCount>0?doneCount+'/'+totalCount:''}</div>
      </div>
      <button class="project-delete" title="删除项目" onclick="event.stopPropagation();deleteProject('${p.id}')">×</button>
    </div>`;
  }).join('');
}

/* ============ MAIN RENDER ============ */
function renderMain(){
  const p=getCurrentProject();
  const el=document.getElementById('content');
  if(!p){
    el.innerHTML=`<div class="card"><div class="empty">

function renderSeries(p){

  const items=labels[p.suiteType]||labels.square;
  return `<div class="gen-list">
    ${p.series.map((s,i)=>{
      const qc=p.qcResults[i];
      const isVert=p.suiteType==='vertical'||(p.suiteType==='full'&&i>=5);
      return `<div class="gen-item">
        <div class="gen-item-img ${isVert?'vertical':''}">
          ${s.image?`<img src="${s.image}">`:`<div class="gen-item-placeholder">${s.status==='running'?'生成中...':s.status==='error'?'❌ 失败':'⏳ 待生成'}</div>`}

        <div class="gen-item-info">
          <div class="gen-item-label">${i+1}. ${esc(s.label||items[i])}</div>
          <div class="gen-item-meta">
            ${s.model?`<span class="tag tag-info">${s.model.includes('openai')?'OpenAI':s.model.includes('base')?'豆包白底':'豆包'}</span>`:''}
            ${qc?qc.pass?`<span class="tag tag-success">${qc.redone?'↻ 重做通过':'✓ 质检通过'} ${qc.score}分</span>`:`<span class="tag tag-danger">! 建议复核 ${qc.score}分</span>`:''}
          </div>
          ${qc?.summary?`<div style="font-size:10px;color:var(--light);margin-top:5px;line-height:1.45">${esc(qc.summary)}</div>`:''}

function setPlatform(k){ const p=getCurrentProject(); if(p){p.platform=k;renderMain();} }
function setSuiteType(k){ const p=getCurrentProject(); if(p){p.suiteType=k;renderMain();} }
function setDirection(k){ const p=getCurrentProject(); if(p){p.direction=k;renderMain();} }

async function handleUpload(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>8*1024*1024){ toast('图片超过8MB限制','error'); return; }
  const validTypes=['image/jpeg','image/png','image/webp'];
  if(!validTypes.includes(file.type)){ toast('图片格式错误，支持JPG/PNG/WebP','error'); return; }
  const p=getCurrentProject(); if(!p) return;
  try{
    const b64=await fileToBase64(file);
    p.image=b64; p.name=file.name.replace(/\.[^.]+$/,'').slice(0,20)||p.name;
    p.analysis=null; p.whiteImage=''; p.series=[]; p.qcResults=[]; p.status='idle'; p.phase='商品图已上传，等待选择生成方向';
    renderProjectList(); renderMain();
    toast('图片上传成功','success');
  }catch(err){ toast('图片读取失败','error'); }
}

/* ============ API CALLS ============ */
async function apiCall(path,data,extraHeaders){
  const headers={'Content-Type':'application/json','X-Request-Id':uid(),...(extraHeaders||{})};
  if(state.settings.arkKey) headers['X-Ark-Key']=state.settings.arkKey;
  if(state.settings.openaiKey) headers['X-OpenAI-Key']=state.settings.openaiKey;
  const resp=await fetch(getApiBase()+path,{method:'POST',headers,body:JSON.stringify(data)});
  const raw=await resp.text();
  let json={};
  try{ json=raw?JSON.parse(raw):{}; }catch(e){ throw new Error('服务器返回格式异常（HTTP '+resp.status+'）'); }
  if(!resp.ok) throw new Error(json.error||'请求失败（HTTP '+resp.status+'）');
  return json;
}

/* ============ GENERATION FLOW ============ */
const OUTPUT_LABELS={square:['白底商品主图','核心卖点场景','材质做工细节','尺寸使用感知','转化留白构图'],vertical:['首屏卖点概览','核心结构功能','材质工艺证明','尺寸适配说明','使用场景收尾'],full:['白底商品主图','核心卖点场景','材质做工细节','尺寸使用感知','转化留白构图','首屏卖点概览','核心结构功能','材质工艺证明','尺寸适配说明','使用场景收尾']};
function modelOptions(){ return {visionModel:state.settings.visionModel||undefined,imageModel:state.settings.imageModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined}; }
function outputAspect(p,index){ return p.suiteType==='vertical'||(p.suiteType==='full'&&index>=5)?'vertical':'square'; }

async function generateOneTask(p,task,index){
  const item=p.series[index];
  item.prompt=task.prompt; item.status='running';
  p.phase='正在生成第 '+(index+1)+' 张：'+item.label;
  renderMain(); renderProjectList();
  try{
    const aspect=outputAspect(p,index);
    const imgResp=await apiCall('/api/series-image',{prompt:task.prompt,whiteImageBase64:p.whiteImage,aspect,...modelOptions()});
    item.image=imgResp.image; item.model=imgResp.model; item.status='done';
    if(imgResp.fallback) toast('图'+(index+1)+'已自动切换豆包完成','warn');
    p.phase='正在质检第 '+(index+1)+' 张：'+item.label;
    renderMain();
    try{
      let qc=await apiCall('/api/qc',{whiteImageBase64:p.whiteImage,generatedImageBase64:item.image,taskLabel:item.label,platform:p.platform,visionModel:state.settings.visionModel||undefined});
      p.qcResults[index]=qc;
      if(!qc.pass){
        toast('图'+(index+1)+'未通过质检，正在自动修正重做','warn');
        p.phase='第 '+(index+1)+' 张质检未通过，正在自动重做'; renderMain();
        const correction=(qc.correction||qc.summary||'恢复商品真实外观并移除错误元素').slice(0,300);
        const redoResp=await apiCall('/api/series-image',{prompt:task.prompt+'\n质检修正要求：'+correction,whiteImageBase64:p.whiteImage,aspect,...modelOptions()});
        item.image=redoResp.image; item.model=redoResp.model+'-redo';
        const qc2=await apiCall('/api/qc',{whiteImageBase64:p.whiteImage,generatedImageBase64:item.image,taskLabel:item.label,platform:p.platform,visionModel:state.settings.visionModel||undefined});
        qc2.redone=true; p.qcResults[index]=qc2;
      }
    }catch(qcError){
      p.qcResults[index]={pass:false,score:0,summary:'自动质检暂时未完成，建议人工复核',correction:''};
      toast('图'+(index+1)+'质检暂未完成','warn');
    }
  }catch(error){
    item.status='error';
    toast('图'+(index+1)+'生成失败：'+error.message,'error');
  }
  renderMain(); renderProjectList();
}

async function runPool(tasks,limit){
  let cursor=0;
  async function worker(){ while(cursor<tasks.length){ const task=tasks[cursor++]; await task(); } }
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},worker));
}

async function startGeneration(){
  const p=getCurrentProject(); if(!p||!p.image) return;
  if(!state.settings.arkKey){ toast('请先配置火山方舟API Key','warn'); showSettings(); return; }
  const labels=OUTPUT_LABELS[p.suiteType];
  p.series=labels.map((label,index)=>({id:index,label,prompt:'',image:'',status:'pending',model:''}));
  p.qcResults=[]; p.status='running'; p.phase='正在识别商品并规划整套图片'; p.whiteImage=''; p.analysis=null;
  renderMain(); renderProjectList();
  try{
    toast('正在识别商品并制定平台提示词...','');
    const analysis=await apiCall('/api/analyze',{imageBase64:p.image,platform:p.platform,suiteType:p.suiteType,direction:p.direction,userNote:p.userNote,visionModel:state.settings.visionModel||undefined});
    p.analysis=analysis; p.phase='正在制作保真白底基准图'; renderMain();

    const whiteResp=await apiCall('/api/white-image',{prompt:analysis.white_prompt,imageBase64:p.image,imageModel:state.settings.imageModel||undefined});
    p.whiteImage=whiteResp.image;
    const hasWhiteOutput=p.suiteType!=='vertical';
    if(hasWhiteOutput){
      p.series[0]={...p.series[0],prompt:analysis.white_prompt,image:whiteResp.image,status:'done',model:'doubao-base'};
      p.qcResults[0]={pass:true,score:100,summary:'白底基准图',correction:''};
    }
    renderMain(); renderProjectList();

    const plans=analysis.series||[];
    const offset=hasWhiteOutput?1:0;
    const jobs=plans.map((task,i)=>()=>generateOneTask(p,{label:labels[i+offset],prompt:task.prompt},i+offset));
    await runPool(jobs,2);

    const doneCount=p.series.filter(item=>item.image).length;
    p.status=doneCount===labels.length?'done':'error';
    p.phase=doneCount===labels.length?'整套图片已生成并完成质检':'部分图片未完成，可单张重做';
    renderMain(); renderProjectList();
    if(doneCount){
      await idbAdd({id:p.id,name:p.name,platform:p.platform,suiteType:p.suiteType,direction:p.direction,whiteImage:p.whiteImage,series:p.series.map(item=>({label:item.label,image:item.image,model:item.model,prompt:item.prompt})),qcResults:p.qcResults,createdAt:Date.now()});
      toast((doneCount===labels.length?'整套生成完成！':'生成完成，部分图片需要重做。')+' 已保存到历史记录',doneCount===labels.length?'success':'warn');
    }
  }catch(error){
    p.status='error'; p.phase='任务中断'; renderMain(); renderProjectList();
    toast('生成失败：'+error.message,'error');
  }
}

async function regenSingle(idx){
  const p=getCurrentProject(); if(!p||!p.whiteImage) return;
  const item=p.series[idx]; if(!item||!item.prompt) return;
  if(item.model==='doubao-base'){ toast('白底主图需要重新运行整套任务','warn'); return; }
  item.status='running'; item.image=''; p.qcResults[idx]=null; renderMain();
  await generateOneTask(p,{label:item.label,prompt:item.prompt},idx);
  toast(item.image?'图'+(idx+1)+'重新生成完成':'图'+(idx+1)+'重新生成失败',item.image?'success':'error');
}

/* ============ DOWNLOAD ============ */
function downloadSingle(idx){
  const p=getCurrentProject(); if(!p) return;
  const s=p.series[idx]; if(!s||!s.image) return;
  const blob=base64ToBlob(s.image);
  downloadBlob(blob,`${p.name}_${idx+1}_${s.label}.png`);
}
async function downloadAll(){
  const p=getCurrentProject(); if(!p) return;
  const imgs=p.series.filter(s=>s.image);
  const expected=p.suiteType==='full'?10:5;
  if(imgs.length<expected){ toast('需要'+expected+'张图才能下载整套，当前'+imgs.length+'张','warn'); return; }
  toast('正在打包ZIP...','');
  try{
    if(typeof JSZip==='undefined'){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    const zip=new JSZip();
    imgs.forEach((s,i)=>{ const blob=base64ToBlob(s.image); zip.file(`${p.name}_${String(i+1).padStart(2,'0')}_${s.label}.png`,blob); });
    const content=await zip.generateAsync({type:'blob'});
    downloadBlob(content,`${p.name}_套图.zip`);
    toast('ZIP下载完成','success');
  }catch(err){ toast('ZIP打包失败：'+err.message,'error'); }
}
function loadScript(src){ return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); }); }

function updateApiStatus(){
  const el=document.getElementById('api-status');
  if(state.settings.arkKey&&state.settings.openaiKey) el.textContent='✅ 火山方舟+OpenAI';
  else if(state.settings.arkKey) el.textContent='✅ 火山方舟';
  else if(state.settings.openaiKey) el.textContent='⚠️ 仅OpenAI（需火山方舟）';
  else el.textContent='❌ 未配置API';
}

/* ============ HISTORY ============ */
async function showHistory(){
  const records=await idbAll();
  records.sort((a,b)=>b.createdAt-a.createdAt);
  showModal(`
    <div class="modal-title">历史记录（${records.length}条）</div>
    <div style="max-height:60vh;overflow-y:auto">
      ${records.length?records.map(r=>`
        <div class="history-item" onclick="viewHistoryDetail('${r.id}')">
          ${r.whiteImage?`<img class="history-thumb" src="${r.whiteImage}">`:`<div class="history-thumb" style="background:var(--bg)"></div>`}
          <div class="history-info">
            <div class="history-title">${esc(r.name)}</div>
            <div class="history-meta">${{taobao:'淘宝',pdd:'拼多多','1688':'1688'}[r.platform]||r.platform} · ${r.series.length}张 · ${formatTime(r.createdAt)}</div>
          </div>
          <button class="btn btn-sm" onclick="event.stopPropagation();deleteHistory('${r.id}')">删除</button>
        </div>
      `).join(''):'<div class="empty">暂无历史记录</div>'}
    </div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">关闭</button></div>
  `);
}
async function viewHistoryDetail(id){
  const records=await idbAll();
  const r=records.find(x=>x.id===id); if(!r) return;
  showModal(`
    <div class="modal-title">${esc(r.name)} - 详情</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${{taobao:'淘宝',pdd:'拼多多','1688':'1688'}[r.platform]} · ${formatTime(r.createdAt)}</div>
    ${r.whiteImage?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">白底基准图</div><img src="${r.whiteImage}" style="max-width:150px;border-radius:8px"></div>`:''}
    <div class="gen-list">
      ${r.series.map((s,i)=>`<div class="gen-item">
        <div class="gen-item-img">${s.image?`<img src="${s.image}">`:'<div class="gen-item-placeholder">无图</div>'}</div>
        <div class="gen-item-info"><div class="gen-item-label">${i+1}. ${esc(s.label)}</div>${s.image?`<div class="gen-item-actions"><button class="btn btn-sm" onclick="downloadHistoryImg('${r.id}',${i})">下载</button></div>`:''}</div>
      </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn" onclick="showHistory()">返回列表</button><button class="btn btn-primary" onclick="downloadHistoryZip('${r.id}')">整套下载</button></div>
  `);
}
async function deleteHistory(id){
  if(!confirm('删除该历史记录？')) return;
  await idbDel(id); showHistory(); toast('已删除','success');
}
async function downloadHistoryImg(id,idx){
  const records=await idbAll(); const r=records.find(x=>x.id===id); if(!r) return;
  const s=r.series[idx]; if(!s||!s.image) return;
  downloadBlob(base64ToBlob(s.image),`${r.name}_${idx+1}_${s.label}.png`);
}
async function downloadHistoryZip(id){
  const records=await idbAll(); const r=records.find(x=>x.id===id); if(!r) return;
  const imgs=r.series.filter(s=>s.image); if(!imgs.length){ toast('无可下载图片','warn'); return; }
  toast('正在打包ZIP...','');
  try{
    if(typeof JSZip==='undefined'){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    const zip=new JSZip();
    imgs.forEach((s,i)=>{ zip.file(`${r.name}_${String(i+1).padStart(2,'0')}_${s.label}.png`,base64ToBlob(s.image)); });
    downloadBlob(await zip.generateAsync({type:'blob'}),`${r.name}_套图.zip`);
    toast('ZIP下载完成','success');
  }catch(err){ toast('ZIP打包失败','error'); }
}

/* ============ MODAL ============ */
function showModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modal-overlay').classList.add('show'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }
function toggleSidebar(open){ document.getElementById('sidebar').classList.toggle('open',open); document.getElementById('backdrop').classList.toggle('show',open); }

/* ============ INIT ============ */
loadState(); updateApiStatus(); if(!state.projects.length)newProject(); else{renderProjectList();renderMain();}
