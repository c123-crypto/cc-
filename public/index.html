      <div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-sm" onclick="exportSettingsBackup()">导出加密设置</button><button class="btn btn-sm" onclick="importSettingsBackup()">导入设置备份</button></div>
      <div style="font-size:10px;color:var(--light);margin-top:7px">请牢记备份密码；密码无法找回。固定下载文件夹需在每台电脑单独授权。</div>
    </div>
    <div class="form-group">
      <label class="label">火山方舟 API Key（选填）</label>
      <input class="input" type="password" id="set-ark" value="${esc(state.settings.arkKey)}" placeholder="填写 API Key 列中的完整密钥">
      <div style="font-size:11px;color:var(--light);margin-top:4px">请复制“API Key”列眼睛图标对应的完整密钥，不要填写右侧“资源 ID”。同一个 Key 可调用账户已开通的 DeepSeek、豆包视觉和 Seedream。</div>
    </div>
    <div class="form-group">
      <label class="label">火山文字模型 ID（DeepSeek）</label>
      <input class="input" id="set-ark-text-model" value="${esc(state.settings.arkTextModel||'')}" placeholder="例如 deepseek-v4-pro-ga-260813">
      <div style="font-size:11px;color:var(--light);margin-top:4px">用于纯文字文案、标题、脚本和推理。请填写模型详情页的完整 Model ID，不要只填末尾数字。</div>
    </div>
    <div class="form-group">
      <label class="label">OpenAI API Key（选填）</label>
      <input class="input" type="password" id="set-openai" value="${esc(state.settings.openaiKey)}" placeholder="sk-xxx...">
      <div style="font-size:11px;color:var(--light);margin-top:4px">用于可选的GPT Image 2生成与编辑</div>
    </div>
    <div class="form-group">
      <label class="label">Gemini API Key（推荐，选填）</label>
      <input class="input" type="password" id="set-gemini" value="${esc(state.settings.geminiKey)}" placeholder="AIza...">
      <div style="font-size:11px;color:var(--light);margin-top:4px">用于免费额度优先的文字生成、提示词规划和Nano Banana生图；额度以Google账户为准</div>
    </div>
    <label style="display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--primary-bg);cursor:pointer">
      <input type="checkbox" id="set-image-fallback" ${state.settings.imageFallback!==false?'checked':''} style="margin-top:2px">
      <span><strong style="display:block;font-size:12px">图片模型失败时自动使用备用模型</strong><span style="display:block;font-size:10px;color:var(--sub);margin-top:3px;line-height:1.5">遇到额度、权限、超时或服务错误时，依次尝试其他已配置模型；内容安全拦截不会绕过。</span></span>
    </label>
    <details style="margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px">
      <summary style="cursor:pointer;font-size:12px;font-weight:600">图片功能模型设置</summary>
      <div class="form-group" style="margin-top:12px"><label class="label">豆包多模态视觉模型 ID</label><input class="input" id="set-vision-model" value="${esc(state.settings.visionModel||'')}" placeholder="Doubao-Seed-2.1-pro 的完整 Model ID"><div class="model-note">负责看懂商品图。DeepSeek 是文字模型，不能填在这里。</div></div>
      <div class="form-group"><label class="label">Seedream 图片模型 ID</label><input class="input" id="set-image-model" value="${esc(state.settings.imageModel||'')}" placeholder="Seedream 5.0 Pro / Lite / 4.5 的完整 Model ID"><div class="model-note">负责生成和编辑图片，可随时换成账户已开通的另一个 Seedream 型号。</div></div>
      <div class="form-group"><label class="label">OpenAI 图片模型</label><input class="input" id="set-openai-model" value="${esc(state.settings.openaiImageModel||'')}" placeholder="留空使用服务器默认模型"></div>
      <div class="form-group"><label class="label">Gemini 文字模型</label><input class="input" id="set-gemini-text-model" value="${esc(state.settings.geminiTextModel||'')}" placeholder="默认 gemini-3.7-flash"></div>
      <div class="form-group"><label class="label">Gemini 图片模型</label><input class="input" id="set-gemini-image-model" value="${esc(state.settings.geminiImageModel||'')}" placeholder="默认 gemini-3.1-flash-image"></div>
    </details>
    <div style="font-size:11px;color:var(--light);line-height:1.6;margin-top:12px">“保存并检测”会检测 DeepSeek/火山文字模型。豆包视觉与 Seedream 会在图片功能首次调用时分别验证；文字模型通过不代表生图模型也已开通。</div>
    <div class="connection-results" id="connection-results">${connectionResultsHtml()}</div>
    <div class="modal-actions">
      <button class="btn" style="margin-right:auto;color:var(--danger)" onclick="clearApiSettings()">清除密钥</button>
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="test-connections-btn" onclick="saveAndTestApiSettings()">保存并检测</button>
    </div>
  `);
  loadDownloadFolderName().then(updateDownloadFolderUi);
}
function cleanModelId(value){
  return String(value||'').trim().split(/\s+/)[0].replace(/[，。；;,]+$/g,'');
}
function readApiSettingsForm(){
  state.settings.arkKey=document.getElementById('set-ark').value.trim();
  state.settings.arkTextModel=cleanModelId(document.getElementById('set-ark-text-model').value);
  state.settings.openaiKey=document.getElementById('set-openai').value.trim();
  state.settings.geminiKey=document.getElementById('set-gemini').value.trim();
  state.settings.visionModel=cleanModelId(document.getElementById('set-vision-model').value);
  state.settings.imageModel=cleanModelId(document.getElementById('set-image-model').value);
  state.settings.openaiImageModel=cleanModelId(document.getElementById('set-openai-model').value);
  state.settings.geminiTextModel=cleanModelId(document.getElementById('set-gemini-text-model').value);
  state.settings.geminiImageModel=cleanModelId(document.getElementById('set-gemini-image-model').value);
  document.getElementById('set-ark-text-model').value=state.settings.arkTextModel;
  state.settings.imageFallback=document.getElementById('set-image-fallback').checked;
}
function saveApiSettings(){
  readApiSettingsForm();
  saveSettings(); closeModal(); updateApiStatus(); renderMain();
  toast('设置已保存；尚未检测连接','warn');
}
function connectionResultsHtml(){
  const configured=[state.settings.geminiKey&&['gemini','Gemini'],state.settings.arkKey&&['doubao','火山方舟'],state.settings.openaiKey&&['openai','OpenAI']].filter(Boolean);
  if(!configured.length) return '<div class="connection-result"><strong>尚未填写</strong><span>请至少配置一个模型服务</span></div>';
  return configured.map(([id,label])=>{const item=providerHealth[id];const cls=item?(item.ok?'ok':'fail'):'';const icon=item?(item.ok?'✅':'❌'):'⚪';return `<div class="connection-result ${cls}"><strong>${icon} ${label}</strong><span>${esc(item?.message||'已填写，等待检测')}</span></div>`;}).join('');
}
async function directArkConnectionTest(){
  const model=cleanModelId(state.settings.arkTextModel||state.settings.visionModel);
  if(!model) throw new Error('请先填写火山文字模型 ID');
  const resp=await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.settings.arkKey},
    body:JSON.stringify({model,messages:[{role:'user',content:'只回复两个字：通过'}],max_tokens:256,stream:false})
  });
  const raw=await resp.text(); let data={};
  try{data=raw?JSON.parse(raw):{};}catch(e){}
  if(!resp.ok){
    const detail=data?.error?.message||data?.message||`浏览器直连火山失败（HTTP ${resp.status}）`;
    throw new Error(detail);
  }
  const message=data?.choices?.[0]?.message||{};
  const text=typeof message.content==='string'?message.content:(typeof message.reasoning_content==='string'?message.reasoning_content:'');
  if(!text.trim()) throw new Error('浏览器已连接火山，但模型没有返回文字；请确认该 Model ID 已开通 Chat API');
  return {ok:true,provider:'doubao',model,message:'DeepSeek 浏览器直连正常（已绕开 Cloudflare 525）'};
}
async function saveAndTestApiSettings(){
  readApiSettingsForm(); saveSettings(); providerHealth={}; updateApiStatus();
  const button=document.getElementById('test-connections-btn'); if(button){button.disabled=true;button.textContent='正在检测…';}
  const configured=[state.settings.geminiKey&&'gemini',state.settings.arkKey&&'doubao',state.settings.openaiKey&&'openai'].filter(Boolean);
  if(!configured.length){ toast('请至少填写一个 API Key','warn'); if(button){button.disabled=false;button.textContent='保存并检测';} return; }
  await Promise.all(configured.map(async provider=>{
    try{
      const data=await apiCall('/api/connection-test',{provider,arkTextModel:state.settings.arkTextModel||undefined,visionModel:state.settings.visionModel||undefined,geminiTextModel:state.settings.geminiTextModel||undefined,openaiImageModel:state.settings.openaiImageModel||undefined});
      providerHealth[provider]={ok:true,message:data.message||'连接正常'};
    }catch(error){
      if(provider==='doubao'&&String(error.message||'').includes('HTTP 525')){
        try{
          const data=await directArkConnectionTest();
          providerHealth[provider]={ok:true,message:data.message};
        }catch(directError){providerHealth[provider]={ok:false,message:'Cloudflare线路525；'+directError.message};}
      }else providerHealth[provider]={ok:false,message:error.message};
    }
    const results=document.getElementById('connection-results'); if(results) results.innerHTML=connectionResultsHtml(); updateApiStatus();
  }));
  if(button){button.disabled=false;button.textContent='重新检测';}
  const failed=configured.filter(provider=>!providerHealth[provider]?.ok);
  if(providerHealth.openai?.ok&&(!providerHealth.gemini?.ok||!providerHealth.doubao?.ok)) toolSession.provider='openai';
  if(providerHealth.doubao?.ok&&!providerHealth.gemini?.ok) toolSession.textProvider='doubao';
  renderMain();
  toast(failed.length?`${failed.length} 个模型连接未通过，请查看错误码`:'已填写的模型连接全部通过',failed.length?'error':'success');
}
function clearApiSettings(){
  state.settings={arkKey:'',arkTextModel:'',openaiKey:'',geminiKey:'',visionModel:'',imageModel:'',openaiImageModel:'',geminiTextModel:'',geminiImageModel:'',imageFallback:true};
  providerHealth={}; saveSettings(); closeModal(); updateApiStatus(); renderMain(); toast('本机保存的密钥已清除','success');
}
function updateApiStatus(){
  const el=document.getElementById('api-status');
  const providers=[state.settings.geminiKey&&['gemini','Gemini'],state.settings.arkKey&&['doubao','火山方舟'],state.settings.openaiKey&&['openai','OpenAI']].filter(Boolean);
  if(!providers.length){el.textContent='❌ 未配置API';return;}
  const checked=providers.filter(([id])=>providerHealth[id]);
  const failed=checked.filter(([id])=>!providerHealth[id].ok);
  if(failed.length) el.textContent='⚠️ '+failed.map(([,label])=>label).join('、')+'连接失败';
  else if(checked.length===providers.length) el.textContent='✅ '+providers.map(([,label])=>label).join(' + ')+' 已连接';
  else el.textContent='⚪ 已填写API，等待检测';
}

/* ============ HISTORY ============ */
async function showHistory(){
  await pruneHistory();
  const records=await idbAll();
  records.sort((a,b)=>b.createdAt-a.createdAt);
  showModal(`
    <div class="modal-title">历史记录（${records.length}条）</div>
    <div style="max-height:60vh;overflow-y:auto">
      ${records.length?records.map(r=>`
        <div class="history-item" onclick="viewHistoryDetail('${r.id}')">
          ${r.whiteImage||r.series?.[0]?.image?`<img class="history-thumb" src="${r.whiteImage||r.series[0].image}">`:`<div class="history-thumb" style="background:var(--bg)"></div>`}
          <div class="history-info">
            <div class="history-title">${esc(r.name)}</div>
            <div class="history-meta">${{taobao:'淘宝',pdd:'拼多多','1688':'1688'}[r.platform]||r.platform||'图片工具'} · ${r.series.length}张 · ${formatTime(r.createdAt)}${r.kind==='tool'?' · 24小时缓存':''}</div>
          </div>
          <button class="btn btn-sm" onclick="event.stopPropagation();deleteHistory('${r.id}')">删除</button>
        </div>
      `).join(''):'<div class="empty">暂无历史记录</div>'}
    </div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">关闭</button></div>
  `);
}
async function viewHistoryDetail(id){
  const records=await idbAll();
  const r=records.find(x=>x.id===id); if(!r) return;
  showModal(`
    <div class="modal-title">${esc(r.name)} - 详情</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${{taobao:'淘宝',pdd:'拼多多','1688':'1688'}[r.platform]||r.platform||'图片工具'} · ${formatTime(r.createdAt)}${r.kind==='tool'?' · 保存24小时':''}</div>
    ${r.whiteImage?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">白底基准图</div><img src="${r.whiteImage}" style="max-width:150px;border-radius:8px"></div>`:''}
    <div class="gen-list">
      ${r.series.map((s,i)=>`<div class="gen-item">
        <div class="gen-item-img">${s.image?`<img src="${s.image}">`:'<div class="gen-item-placeholder">无图</div>'}</div>
        <div class="gen-item-info"><div class="gen-item-label">${i+1}. ${esc(s.label)}</div>${s.image?`<div class="gen-item-actions"><button class="btn btn-sm" onclick="downloadHistoryImg('${r.id}',${i})">下载</button></div>`:''}</div>
      </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn" onclick="showHistory()">返回列表</button><button class="btn btn-primary" onclick="downloadHistoryZip('${r.id}')">整套下载</button></div>
  `);
}
async function deleteHistory(id){
  if(!confirm('删除该历史记录？')) return;
  await idbDel(id); showHistory(); toast('已删除','success');
}
async function downloadHistoryImg(id,idx){
  const records=await idbAll(); const r=records.find(x=>x.id===id); if(!r) return;
  const s=r.series[idx]; if(!s||!s.image) return;
  try{await saveDownloadedFile(await imageSourceBlob(s.image),`${r.name}_${idx+1}_${s.label}.png`);}catch(error){toast('下载失败：'+error.message,'error');}
}
async function downloadHistoryZip(id){
  const records=await idbAll(); const r=records.find(x=>x.id===id); if(!r) return;
  const imgs=r.series.filter(s=>s.image); if(!imgs.length){ toast('无可下载图片','warn'); return; }
  toast('正在打包ZIP...','');
  try{
    if(typeof JSZip==='undefined'){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
    const zip=new JSZip();
    for(let i=0;i<imgs.length;i++) zip.file(`${r.name}_${String(i+1).padStart(2,'0')}_${imgs[i].label}.png`,await imageSourceBlob(imgs[i].image));
    await saveDownloadedFile(await zip.generateAsync({type:'blob'}),`${r.name}_套图.zip`);
    toast('ZIP下载完成','success');
  }catch(err){ toast('ZIP打包失败','error'); }
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }
function toggleSidebar(open){ document.getElementById('sidebar').classList.toggle('open',open); document.getElementById('backdrop').classList.toggle('show',open); }

applyDailyTheme(); loadState(); pruneHistory(); loadDownloadFolderName(); updateApiStatus(); renderProjectList(); renderMain();
